<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>四季三餐｜사계삼찬</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#f5f3ef;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Noto Sans KR",Arial,sans-serif;
}

body{
  padding-bottom:110px;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#18251e;
  color:#fff;
  padding:18px 16px 16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px #0002;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:.3px;
}

.subBrand{
  margin-top:3px;
  font-size:12px;
  opacity:.8;
}

.tableBadge{
  background:#c99a52;
  color:#fff;
  padding:7px 11px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  white-space:nowrap;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.notice{
  background:#fff;
  border-radius:14px;
  padding:13px 14px;
  margin-bottom:12px;
  box-shadow:0 1px 5px #0000000d;
}

.notice strong{
  color:#18251e;
}

.typeBox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.typeBtn{
  border:1px solid #ddd;
  background:#fff;
  color:#333;
  border-radius:11px;
  padding:12px;
  font-weight:700;
}

.typeBtn.active{
  background:#18251e;
  border-color:#18251e;
  color:#fff;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 12px;
  scrollbar-width:none;
  position:sticky;
  top:70px;
  background:#f5f3ef;
  z-index:10;
}

.categories::-webkit-scrollbar{
  display:none;
}

.catBtn{
  flex:0 0 auto;
  border:1px solid #ddd;
  background:#fff;
  border-radius:999px;
  padding:8px 14px;
  color:#555;
}

.catBtn.active{
  background:#18251e;
  color:#fff;
  border-color:#18251e;
}

.menu{
  display:grid;
  gap:10px;
}

.menuItem{
  background:#fff;
  border-radius:16px;
  padding:11px;
  display:flex;
  gap:12px;
  min-height:125px;
  box-shadow:0 1px 5px #0000000c;
}

.photo{
  width:120px;
  height:120px;
  flex:0 0 120px;
  border-radius:13px;
  overflow:hidden;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
}

.name{
  font-size:17px;
  font-weight:800;
  line-height:1.35;
}

.kr{
  font-size:12px;
  color:#888;
  margin-top:2px;
}

.category{
  display:inline-block;
  margin-top:7px;
  color:#8b6a36;
  font-size:11px;
}

.price{
  margin-top:auto;
  color:#18251e;
  font-weight:800;
  font-size:17px;
}

.addBtn{
  margin-top:8px;
  width:100%;
  border:0;
  background:#18251e;
  color:#fff;
  border-radius:9px;
  padding:9px 10px;
  font-weight:700;
}

.qtyBox{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  margin-top:8px;
}

.qtyBtn{
  width:31px;
  height:31px;
  border:0;
  border-radius:50%;
  background:#18251e;
  color:#fff;
  font-size:18px;
  line-height:1;
}

.qtyNum{
  min-width:20px;
  text-align:center;
  font-weight:800;
}

.empty{
  text-align:center;
  background:#fff;
  border-radius:15px;
  padding:35px 15px;
  color:#888;
}

.cartBar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px max(12px,calc((100vw - 900px)/2 + 12px));
  box-shadow:0 -3px 18px #0002;
}

.cartButton{
  width:100%;
  max-width:900px;
  margin:auto;
  border:0;
  border-radius:13px;
  background:#18251e;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:800;
}

.cartCount{
  background:#c99a52;
  border-radius:999px;
  padding:4px 9px;
  margin-right:6px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.overlay.show{
  display:flex;
}

.sheet{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:18px;
  animation:up .2s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.sheetTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.sheetTitle h2{
  margin:0;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
}

.cartList{
  display:grid;
  gap:8px;
}

.cartRow{
  background:#f7f6f3;
  border-radius:11px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
}

.cartRowInfo{
  flex:1;
  min-width:0;
}

.cartRowName{
  font-weight:700;
}

.cartRowPrice{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.cartRowQty{
  display:flex;
  align-items:center;
  gap:7px;
}

.smallQty{
  width:29px;
  height:29px;
  border:0;
  border-radius:50%;
  background:#18251e;
  color:#fff;
}

.section{
  margin-top:16px;
}

.sectionTitle{
  font-weight:800;
  margin-bottom:8px;
}

.note{
  width:100%;
  min-height:80px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:11px;
  padding:11px;
  outline:none;
}

.note:focus{
  border-color:#18251e;
}

.totalBox{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:15px;
  padding:14px;
  background:#f7f6f3;
  border-radius:12px;
}

.totalLabel{
  font-weight:700;
}

.total{
  color:#b33a2f;
  font-size:21px;
  font-weight:900;
}

.submit{
  width:100%;
  border:0;
  background:#18251e;
  color:#fff;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  font-weight:800;
  font-size:16px;
}

.submit:disabled{
  opacity:.5;
}

.success{
  text-align:center;
  padding:35px 15px 20px;
}

.successIcon{
  font-size:55px;
}

.success h2{
  margin:10px 0 5px;
}

.success p{
  color:#777;
}

.orderNumber{
  background:#f7f6f3;
  border-radius:11px;
  padding:12px;
  margin-top:15px;
  font-weight:700;
}

.loading{
  text-align:center;
  padding:35px;
  color:#888;
}

.error{
  background:#fff1f0;
  color:#a52820;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

@media(max-width:600px){
  .wrap{
    padding:10px;
  }

  .photo{
    width:105px;
    height:105px;
    flex-basis:105px;
  }

  .menuItem{
    min-height:105px;
  }

  .name{
    font-size:16px;
  }

  .price{
    font-size:16px;
  }
}
</style>

</head>

<body>

<header class="header">
  <div class="headerTop">
    <div>
      <div class="brand">四季三餐</div>
      <div class="subBrand">사계삼찬 · 中韩风味餐厅</div>
    </div>
    <div class="tableBadge" id="tableBadge">1号桌</div>
  </div>
</header>

<main class="wrap">

  <div class="notice">
    <strong>欢迎光临四季三餐</strong>
    <div style="font-size:13px;color:#777;margin-top:4px">
      请先选择用餐方式，然后选择您喜欢的菜品。
    </div>
  </div>

  <div class="typeBox">
    <button id="dineBtn" class="typeBtn active" onclick="setType('DINE_IN')">
      🪑 堂食
    </button>
    <button id="takeBtn" class="typeBtn" onclick="setType('TAKEOUT')">
      🥡 打包
    </button>
  </div>

  <div id="categories" class="categories"></div>

  <div id="menu" class="menu">
    <div class="loading">正在加载菜单……</div>
  </div>

</main>

<div class="cartBar">
  <button class="cartButton" onclick="openCart()">
    <span>
      <span class="cartCount" id="cartCount">0</span>
      查看购物车
    </span>
    <span id="cartTotal">₩0</span>
  </button>
</div>

<div id="cartOverlay" class="overlay" onclick="overlayClick(event)">
  <div class="sheet">

```
<div class="sheetTitle">
  <h2>确认订单</h2>
  <button class="close" onclick="closeCart()">×</button>
</div>

<div id="cartList" class="cartList"></div>

<div class="section">
  <div class="sectionTitle">备注</div>
  <textarea id="note" class="note" maxlength="200"
    placeholder="例如：不要香菜、少辣、打包请分开装……"></textarea>
</div>

<div class="totalBox">
  <span class="totalLabel">订单合计</span>
  <span class="total" id="sheetTotal">₩0</span>
</div>

<button id="submitBtn" class="submit" onclick="submitOrder()">
  确认下单
</button>
```

  </div>
</div>

<div id="successOverlay" class="overlay">
  <div class="sheet">

```
<div class="success">
  <div class="successIcon">✅</div>
  <h2>下单成功</h2>
  <p>您的订单已经发送到后厨。</p>

  <div class="orderNumber">
    订单号：<span id="orderId"></span>
  </div>

  <button class="submit" onclick="closeSuccess()">
    继续点餐
  </button>
</div>
```

  </div>
</div>

<script>
const won = n => "₩" + Number(n || 0).toLocaleString("ko-KR");

const params = new URLSearchParams(location.search);
const table = Math.min(30, Math.max(1, Number(params.get("table")) || 1));

let menu = [];
let cart = {};
let currentCategory = "全部";
let orderType = "DINE_IN";

const tableBadge = document.getElementById("tableBadge");
const menuBox = document.getElementById("menu");
const categoriesBox = document.getElementById("categories");

tableBadge.textContent = orderType === "DINE_IN"
  ? table + "号桌"
  : "打包";

function setType(type){
  orderType = type;

  document.getElementById("dineBtn").classList.toggle("active", type === "DINE_IN");
  document.getElementById("takeBtn").classList.toggle("active", type === "TAKEOUT");

  tableBadge.textContent = type === "DINE_IN"
    ? table + "号桌"
    : "打包";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function imageUrl(item){
  /*
    server.js 如果给菜品保存了 photo / image / imageUrl，
    顾客端会自动读取。
  */
  return item.photo || item.image || item.imageUrl || "";
}

function renderCategories(){

  const cats = ["全部", ...new Set(
    menu.map(x => x.category).filter(Boolean)
  )];

  categoriesBox.innerHTML = cats.map(cat => `
    <button
      class="catBtn ${cat === currentCategory ? "active" : ""}"
      onclick="chooseCategory(${JSON.stringify(cat)})">
      ${escapeHtml(cat)}
    </button>
  `).join("");
}

function chooseCategory(cat){
  currentCategory = cat;
  renderCategories();
  renderMenu();
}

function getFilteredMenu(){
  if(currentCategory === "全部"){
    return menu;
  }

  return menu.filter(x => x.category === currentCategory);
}

function renderMenu(){

  const list = getFilteredMenu();

  if(!list.length){
    menuBox.innerHTML = `
      <div class="empty">
        暂无可售菜品
      </div>
    `;
    return;
  }

  menuBox.innerHTML = list.map(item => {

    const qty = Number(cart[item.id] || 0);
    const img = imageUrl(item);

    const photoHtml = img
      ? `<img src="${escapeHtml(img)}"
              alt="${escapeHtml(item.name)}"
              onerror="this.parentElement.innerHTML='${escapeHtml(item.emoji || "🍽️")}'">`
      : escapeHtml(item.emoji || "🍽️");

    return `
      <div class="menuItem">

        <div class="photo">
          ${photoHtml}
        </div>

        <div class="info">

          <div class="name">
            ${escapeHtml(item.name)}
          </div>

          <div class="kr">
            ${escapeHtml(item.kr || "")}
          </div>

          ${
            item.category
            ? `<div class="category">${escapeHtml(item.category)}</div>`
            : ""
          }

          <div class="price">
            ${won(item.price)}
          </div>

          ${
            qty > 0
            ? `
              <div class="qtyBox">

                <button
                  class="qtyBtn"
                  onclick="changeQty('${escapeHtml(item.id)}',-1)">
                  −
                </button>

                <span class="qtyNum">${qty}</span>

                <button
                  class="qtyBtn"
                  onclick="changeQty('${escapeHtml(item.id)}',1)">
                  ＋
                </button>

              </div>
            `
            : `
              <button
                class="addBtn"
                onclick="changeQty('${escapeHtml(item.id)}',1)">
                加入订单
              </button>
            `
          }

        </div>

      </div>
    `;
  }).join("");
}

function changeQty(id, delta){

  const item = menu.find(x => x.id === id);

  if(!item) return;

  const oldQty = Number(cart[id] || 0);
  const newQty = Math.max(0, oldQty + delta);

  if(newQty === 0){
    delete cart[id];
  }else{
    cart[id] = newQty;
  }

  renderMenu();
  updateCartBar();
}

function getCartItems(){

  return Object.keys(cart)
    .map(id => {

      const item = menu.find(x => x.id === id);

      if(!item) return null;

      return {
        ...item,
        qty:Number(cart[id] || 0)
      };

    })
    .filter(Boolean);
}

function getCartTotal(){

  return getCartItems()
    .reduce((sum,item) => {
      return sum + Number(item.price) * item.qty;
    },0);
}

function updateCartBar(){

  const items = getCartItems();

  const count = items.reduce((sum,item) => {
    return sum + item.qty;
  },0);

  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = won(getCartTotal());
}

function openCart(){

  const items = getCartItems();

  if(!items.length){
    alert("请先选择菜品");
    return;
  }

  renderCart();

  document.getElementById("cartOverlay").classList.add("show");
}

function closeCart(){
  document.getElementById("cartOverlay").classList.remove("show");
}

function overlayClick(e){

  if(e.target.id === "cartOverlay"){
    closeCart();
  }
}

function renderCart(){

  const items = getCartItems();

  const box = document.getElementById("cartList");

  box.innerHTML = items.map(item => `
    <div class="cartRow">

      <div class="cartRowInfo">

        <div class="cartRowName">
          ${escapeHtml(item.name)}
        </div>

        <div class="cartRowPrice">
          ${won(item.price)} × ${item.qty}
        </div>

      </div>

      <div class="cartRowQty">

        <button
          class="smallQty"
          onclick="changeCartQty('${escapeHtml(item.id)}',-1)">
          −
        </button>

        <b>${item.qty}</b>

        <button
          class="smallQty"
          onclick="changeCartQty('${escapeHtml(item.id)}',1)">
          ＋
        </button>

      </div>

    </div>
  `).join("");

  document.getElementById("sheetTotal").textContent =
    won(getCartTotal());
}

function changeCartQty(id,delta){

  changeQty(id,delta);

  if(getCartItems().length === 0){
    closeCart();
    return;
  }

  renderCart();
}

async function submitOrder(){

  const items = getCartItems();

  if(!items.length){
    alert("购物车是空的");
    return;
  }

  const btn = document.getElementById("submitBtn");

  btn.disabled = true;
  btn.textContent = "正在提交……";

  const payload = {
    table,
    type:orderType,
    note:document.getElementById("note").value.trim(),
    items:items.map(item => ({
      id:item.id,
      qty:item.qty
    }))
  };

  try{

    const response = await fetch("/api/orders",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "下单失败");
    }

    cart = {};

    document.getElementById("note").value = "";

    updateCartBar();
    renderMenu();

    closeCart();

    document.getElementById("orderId").textContent =
      data.id || "已提交";

    document.getElementById("successOverlay").classList.add("show");

  }catch(error){

    console.error(error);

    alert(
      "下单失败，请检查网络后重试。\n" +
      (error.message || "")
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "确认下单";

  }
}

function closeSuccess(){
  document.getElementById("successOverlay").classList.remove("show");
}

async function loadMenu(){

  try{

    const response = await fetch("/api/menu", { cache:"no-store" });

    if(!response.ok){
      throw new Error("菜单加载失败");
    }

    const data = await response.json();

    menu = Array.isArray(data) ? data : [];

    renderCategories();
    renderMenu();
    updateCartBar();

  }catch(error){

    console.error(error);

    menuBox.innerHTML = `
      <div class="error">
        菜单加载失败，请刷新页面重试。
      </div>
    `;
  }
}

loadMenu();

// V5：后台新增/修改/上下架菜单后，顾客页面约 5 秒内自动同步。
setInterval(async () => {
  try {
    const response = await fetch("/api/menu", { cache:"no-store" });
    if (!response.ok) return;
    const data = await response.json();
    const next = Array.isArray(data) ? data : [];
    if (JSON.stringify(next) !== JSON.stringify(menu)) {
      menu = next;
      renderCategories();
      renderMenu();
      updateCartBar();
    }
  } catch (e) {
    // 后台轮询失败时不打扰正在点餐的顾客，下次继续尝试。
  }
}, 5000);
</script>

</body>
