<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>사계삼찬｜四季三餐</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f2ea;color:#171b18;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif;padding-bottom:104px}button,input,textarea{font:inherit}button{cursor:pointer}
.hero{background:linear-gradient(145deg,#0d3c2d,#15543d);color:#fff;padding:14px 14px 16px;position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff0c}.hero:before{width:180px;height:180px;right:-70px;top:-90px}.hero:after{width:130px;height:130px;left:-70px;bottom:-75px}.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}.heroActions{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.historyTop{border:1px solid #ffffff99;background:#ffffff10;color:#fff;border-radius:18px;padding:6px 10px;font-size:11px;font-weight:900;line-height:1.15}.historyTop span{display:block;font-size:9px;opacity:.82;margin-top:1px}.logoRow{display:flex;align-items:center;gap:10px}.seal{width:42px;height:52px;border-radius:18px;background:#c72020;display:grid;place-items:center;font-weight:900;font-size:18px;line-height:1.05;text-align:center;box-shadow:0 4px 12px #0002}.brandKr{font-size:29px;font-weight:950;letter-spacing:-1px}.brandCn{font-size:13px;opacity:.9;margin-top:1px}.table{background:#fff;color:#124333;padding:7px 10px;border-radius:20px;font-weight:900;font-size:13px;white-space:nowrap}.tagline{position:relative;z-index:1;text-align:center;margin-top:10px}.tagKr{font-size:14px;font-weight:800}.tagCn{font-size:11px;opacity:.78;margin-top:2px}
.catsWrap{position:sticky;top:0;z-index:28;background:#f6f2ea;padding:8px 10px 7px;box-shadow:0 3px 12px #0000000b}.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{min-width:78px;white-space:nowrap;border:1px solid #e0ddd7;background:#fff;border-radius:14px;padding:8px 10px;color:#1e2622;box-shadow:0 2px 6px #00000008}.cat .k{display:block;font-size:14px;font-weight:900}.cat .c{display:block;font-size:10px;color:#777;margin-top:1px}.cat.on{background:#14513b;color:#fff;border-color:#14513b}.cat.on .c{color:#e8f2ed}
.wrap{max-width:980px;margin:auto;padding:5px 10px 18px}.section{scroll-margin-top:78px;margin:7px 0 16px}.sectionTitle{display:flex;align-items:flex-end;gap:6px;margin:11px 2px 7px}.sectionTitle .k{font-size:19px;font-weight:950}.sectionTitle .c{font-size:12px;color:#777;padding-bottom:2px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.dish{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0000000d;position:relative;min-width:0}.dish.soldout{filter:grayscale(.9);opacity:.62}.soldbadge{position:absolute;right:7px;top:7px;z-index:3;background:#6f6f6f;color:#fff;border-radius:14px;padding:4px 8px;font-size:10px;font-weight:900}.photoWrap{width:100%;aspect-ratio:1.28/1;background:#e9e5dd;overflow:hidden;display:grid;place-items:center}.photo{width:100%;height:100%;object-fit:cover;display:block}.emoji{font-size:45px}.info{padding:9px 9px 10px}.kr{font-weight:950;font-size:17px;line-height:1.15;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cn{font-size:11px;color:#5f625f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardBottom{display:flex;align-items:end;justify-content:space-between;gap:5px;margin-top:8px}.price{font-weight:900;font-size:15px;color:#124b37;white-space:nowrap}.btn{border:0;border-radius:10px;padding:8px 10px;background:#14513b;color:#fff;font-weight:900}.addBtn{font-size:13px;white-space:nowrap;min-width:62px}.addBtn .cnSmall{display:block;font-size:9px;font-weight:700;opacity:.8;margin-top:1px}.btn:disabled{background:#999}.gold{background:#a87928}
.cartPanel{background:#fff;border-radius:14px;padding:12px;margin-top:12px;box-shadow:0 2px 10px #0000000a}.cartPanel h3{margin:0 0 9px;font-size:17px}.cartPanel h3 .cnSmall{font-size:11px;color:#777;font-weight:600}.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border:0;border-radius:50%;background:#14513b;color:#fff;font-weight:900}.qty .del{width:auto;border-radius:9px;background:#e9e9e9;color:#8a2c2c;padding:0 9px;font-size:11px}.muted{font-size:11px;color:#777}.noteLabel{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}.note{width:100%;min-height:62px;border:1px solid #ddd;border-radius:10px;padding:9px;background:#fff}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:#0f4b36;color:#fff;border-top:1px solid #0b3b2b;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(105px,.9fr) minmax(120px,1.15fr) auto;gap:8px;align-items:center;z-index:35;box-shadow:0 -5px 18px #0002}.cartBadge{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#fff;text-align:left;padding:3px 4px}.cartIcon{font-size:27px;line-height:1;position:relative}.countBubble{position:absolute;right:-8px;top:-8px;background:#ef2424;color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:950}.cartBadgeText b{display:block;font-size:14px}.cartBadgeText span{display:block;font-size:10px;opacity:.85;margin-top:1px}.cartSummary{text-align:center;border:0;background:transparent;color:#fff;padding:5px 6px;border-left:1px solid #ffffff33;border-right:1px solid #ffffff33}.cartSummary:active{background:#ffffff12}.cartSummary .total{font-size:20px;font-weight:950;color:#ffd93d;white-space:nowrap}.cartHint{font-size:9px;color:#fff;font-weight:800;margin-top:2px;opacity:.92}.submitBtn{padding:10px 15px;min-width:94px;background:#e91f25;border-radius:12px}.submitBtn .k{display:block;font-size:15px}.submitBtn .c{display:block;font-size:9px;opacity:.88;margin-top:1px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.dialog{background:#fff;width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.variant{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin:7px 0;background:#fff}.ordercard{border:1px solid #e2e2e2;border-radius:12px;padding:12px;margin:9px 0}.status{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;background:#eee}.sNEW{background:#ffe1df;color:#a12b22}.sCOOKING{background:#fff0bd;color:#805900}.sDONE{background:#dff4e8;color:#176b42}.sPAID{background:#e5e5e5;color:#555}.sCANCELLED{background:#eee;color:#888}
@media(min-width:700px){.hero{padding-left:24px;padding-right:24px}.brandKr{font-size:34px}.menu{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kr{font-size:19px}.cn{font-size:12px}.photoWrap{aspect-ratio:1.35/1}.modal{align-items:center;justify-content:center}.dialog{max-width:560px;border-radius:18px}.catsWrap{padding-left:max(10px,calc((100vw - 980px)/2 + 10px));padding-right:max(10px,calc((100vw - 980px)/2 + 10px))}}
@media(max-width:355px){.menu{gap:6px}.wrap{padding-left:7px;padding-right:7px}.kr{font-size:15px}.price{font-size:13px}.addBtn{min-width:55px;padding:7px 8px}.brandKr{font-size:25px}}
</style>
</head>
<body>
<header class="hero">
  <div class="heroTop">
    <div class="logoRow"><div class="seal">四<br>季</div><div><div class="brandKr">사계삼찬</div><div class="brandCn">四季三餐</div></div></div>
    <div class="heroActions"><span id="tableBadge" class="table"></span><button class="historyTop" onclick="openMyOrders()">주문내역<span>我的订单</span></button></div>
  </div>
  <div class="tagline"><div class="tagKr">좋은 음식, 좋은 하루</div><div class="tagCn">好好吃饭 · 好好生活</div></div>
</header>
<div class="catsWrap"><div id="cats" class="cats"></div></div>
<main class="wrap">
  <div id="menuSections"></div>
  <textarea id="note" class="note" style="display:none" aria-hidden="true"></textarea>
</main>
<div class="cartbar"><button class="cartBadge" onclick="openCart()"><span class="cartIcon">🛒<span id="cartCountBubble" class="countBubble">0</span></span><span class="cartBadgeText"><b>장바구니</b><span id="cartCountCn">已选 0 件</span></span></button><button class="cartSummary" onclick="openCart()"><div id="cartTotal" class="total">₩0</div><div class="cartHint">선택 메뉴 보기 / 查看已选菜品</div></button><button class="btn submitBtn" onclick="submitOrder()"><span class="k">주문하기</span><span class="c">提交订单</span></button></div>
<div id="cartModal" class="modal"><div class="dialog"><h2>장바구니 / 购物车</h2><div class="muted" style="margin:-4px 0 10px">주문 전 수량 변경·삭제 가능 / 下单前可修改数量或删除菜品</div><div id="cartPopup"></div><div style="text-align:right;margin-top:8px"><button class="btn" style="background:#eee;color:#7f2929;padding:7px 10px" onclick="clearCart()">장바구니 비우기 / 清空</button></div><label class="noteLabel">요청사항 / 备注</label><textarea id="notePopup" class="note" placeholder="예: 고수 빼주세요 / 例如：不要香菜"></textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1;background:#777" onclick="closeCart()">계속 주문 / 继续点餐</button><button class="btn" style="flex:1" onclick="submitOrder()">주문하기 / 下单</button></div></div></div><div id="variantModal" class="modal"><div class="dialog"><h2 id="vmTitle"></h2><div id="vmList"></div><button class="btn" onclick="variantModal.style.display='none'">취소 / 取消</button></div></div>
<div id="ordersModal" class="modal"><div class="dialog"><h2>내 주문 / 我的订单</h2><div id="myOrders"></div><button class="btn" onclick="ordersModal.style.display='none'">닫기 / 关闭</button></div></div>
<script>
const $=id=>document.getElementById(id),won=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);let table=Math.min(20,Math.max(1,Number(q.get('table')||1))),menus=[],cartMap=new Map(),activeCat='';tableBadge.textContent=table+'번 · '+table+'号桌';
const prefCats=['主食','面类','饺子','凉菜','饮料','酒水','其他'];
const catKr={'主食':'주식','面类':'면류','饺子':'만두','凉菜':'요리','饮料':'음료','酒水':'주류','其他':'기타'};
function categoryOf(x){let c=String(x.category||'').trim(),n=(x.name||'')+' '+(x.kr||'');if(/饮料|饮品|可乐|雪碧|汽水|콜라|사이다/.test(c+n))return'饮料';if(/酒|啤|烧酒|맥주|소주/.test(c+n))return'酒水';if(/凉菜|冷菜|小菜|반찬|냉채/.test(c+n))return'凉菜';if(/饺|锅贴|馄饨|水饺|만두|완탕/.test(c+n))return'饺子';if(/面|면|자장/.test(c+n))return'面类';if(c&&prefCats.includes(c))return c;if(c&&/主食/.test(c))return'主食';return c||'主食'}
function keyOf(id,vid){return id+'::'+(vid||'')}
async function load(){let r=await fetch('/api/menu',{cache:'no-store'});menus=await r.json();renderAll()}setInterval(load,5000);
function catsPresent(){let s=new Set(menus.map(categoryOf));return prefCats.filter(c=>s.has(c))}
function renderAll(){let cs=catsPresent();cats.innerHTML=cs.map((c,i)=>`<button class="cat ${(!activeCat&&i===0)||activeCat===c?'on':''}" onclick="jumpCat('${esc(c)}')"><span class="k">${esc(catKr[c]||c)}</span><span class="c">${esc(c)}</span></button>`).join('');menuSections.innerHTML=cs.map(c=>`<section id="cat-${encodeURIComponent(c)}" class="section"><div class="sectionTitle"><span class="k">${esc(catKr[c]||c)}</span><span class="c">${esc(c)}</span></div><div class="menu">${menus.filter(x=>categoryOf(x)===c).map(card).join('')}</div></section>`).join('')||'<p>메뉴가 없습니다 / 暂无菜品</p>'}
function jumpCat(c){activeCat=c;renderAll();let el=document.getElementById('cat-'+encodeURIComponent(c));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function card(x){let sold=x.on===false;let price=Array.isArray(x.variants)&&x.variants.length?'₩'+won(Math.min(...x.variants.map(v=>Number(v.price||0))))+'~':'₩'+won(x.price);return `<div class="dish ${sold?'soldout':''}">${sold?'<span class="soldbadge">품절 / 售罄</span>':''}<div class="photoWrap">${x.image?`<img class="photo" src="${esc(x.image)}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=emoji>🍽️</div>'">`:`<div class="emoji">${esc(x.emoji||'🍽️')}</div>`}</div><div class="info"><div class="kr">${esc(x.kr||x.name)}</div><div class="cn">${esc(x.name)}</div><div class="cardBottom"><div class="price">${price}</div><button class="btn addBtn" ${sold?'disabled':''} onclick="choose('${esc(x.id)}')">${sold?'품절':(x.variants?.length?'선택':'＋ 담기')}<span class="cnSmall">${sold?'售罄':(x.variants?.length?'选规格':'加入')}</span></button></div></div></div>`}
function choose(id){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;if(Array.isArray(x.variants)&&x.variants.length){vmTitle.textContent=(x.kr||x.name)+' / '+x.name;vmList.innerHTML=x.variants.map(v=>`<button class="variant" onclick="add('${esc(x.id)}','${esc(v.id)}')"><span><b>${esc(v.kr||v.name)} / ${esc(v.name)}</b></span><b>₩${won(v.price)}</b></button>`).join('');variantModal.style.display='flex'}else add(id,'')}
function add(id,vid){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;let v=(x.variants||[]).find(a=>String(a.id)===String(vid)),k=keyOf(id,vid),old=cartMap.get(k);cartMap.set(k,{id:x.id,variantId:vid,name:x.name,kr:x.kr||'',variantName:v?.name||'',variantKr:v?.kr||'',price:Number(v?v.price:x.price||0),qty:(old?.qty||0)+1});variantModal.style.display='none';renderCart()}
function qty(k,d){let x=cartMap.get(k);if(!x)return;x.qty+=d;if(x.qty<=0)cartMap.delete(k);renderCart()}
function removeItem(k){cartMap.delete(k);renderCart()}
function clearCart(){if(!cartMap.size)return;if(confirm('장바구니를 비울까요? / 确定清空购物车吗？')){cartMap.clear();renderCart()}}
function cartHtml(){let a=[...cartMap.entries()];return a.map(([k,x])=>`<div class="line"><span><b>${esc(x.kr||x.name)}${x.variantKr?' ('+esc(x.variantKr)+')':''}</b><br><span class="muted">${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''} · ₩${won(x.price)}</span></span><span class="qty"><button onclick="qty('${esc(k)}',-1)">−</button><b>${x.qty}</b><button onclick="qty('${esc(k)}',1)">＋</button><button class="del" onclick="removeItem('${esc(k)}')">삭제 / 删除</button></span></div>`).join('')||'<span class="muted">선택한 메뉴가 없습니다 / 还没有选择菜品</span>'}
function renderCart(){let a=[...cartMap.entries()],html=cartHtml();if(window.cartPopup)cartPopup.innerHTML=html;let count=a.reduce((s,[,x])=>s+x.qty,0),total=a.reduce((s,[,x])=>s+x.qty*x.price,0);cartCountBubble.textContent=count;cartCountCn.textContent='已选 '+count+' 件';cartTotal.textContent='₩'+won(total)}
function openCart(){cartPopup.innerHTML=cartHtml();notePopup.value=note.value;cartModal.style.display='flex'}
function closeCart(){note.value=notePopup.value;cartModal.style.display='none'}
function orderKey(){return 'sijisancan_orders_table_'+table}function savedIds(){try{return JSON.parse(localStorage.getItem(orderKey())||'[]')}catch{return[]}}function saveOrderId(id){let a=savedIds().filter(Boolean);if(!a.includes(id))a.push(id);localStorage.setItem(orderKey(),JSON.stringify(a.slice(-50)))}
async function submitOrder(){if(window.cartModal&&cartModal.style.display==='flex')note.value=notePopup.value;let items=[...cartMap.values()].map(x=>({id:x.id,variantId:x.variantId,qty:x.qty}));if(!items.length)return alert('메뉴를 선택해 주세요 / 请先选择菜品');let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table,type:'DINE_IN',items,note:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'주문 실패 / 下单失败');if(d.id)saveOrderId(d.id);cartMap.clear();note.value='';if(window.notePopup)notePopup.value='';if(window.cartModal)cartModal.style.display='none';renderCart();alert('주문이 접수되었습니다! / 下单成功！');openMyOrders()}
const statusText={NEW:'주문완료 / 已下单',COOKING:'조리중 / 制作中',DONE:'완료 / 已完成',PAID:'결제완료 / 已结账',CANCELLED:'취소 / 已取消'};
async function openMyOrders(){
  ordersModal.style.display='flex';
  myOrders.innerHTML='<p class="muted">불러오는 중… / 正在加载…</p>';
  const ids=savedIds();
  if(!ids.length){myOrders.innerHTML='<p class="muted">이 기기에서 주문한 내역이 없습니다. / 本设备还没有下单记录。</p>';return}
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),8000);
    const url='/api/customer/orders?ids='+encodeURIComponent(ids.join(','))+'&table='+encodeURIComponent(table);
    const r=await fetch(url,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    const text=await r.text();
    let a;try{a=JSON.parse(text)}catch{throw new Error('invalid_json')}
    if(!r.ok||!Array.isArray(a))throw new Error((a&&a.error)||'load_failed');

    // V7.2.6 顾客隐私：
    // 只显示当前还在进行中的订单，已结账/已取消视为上一轮顾客订单，不再展示。
    const active=a.filter(o=>['NEW','COOKING','DONE'].includes(o.status));

    // 同时清理本机缓存里的已结账/已取消订单ID，防止下一位顾客再次看到。
    const activeIds=new Set(active.map(o=>String(o.id)));
    const kept=ids.filter(id=>activeIds.has(String(id)));
    localStorage.setItem(orderKey(),JSON.stringify(kept.slice(-50)));

    myOrders.innerHTML=active.map(o=>`<div class="ordercard"><div><b>${o.table}번 / ${o.table}号桌</b>　<span class="status s${esc(o.status)}">${statusText[o.status]||o.status}</span></div><div class="muted">${new Date(o.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})} · ${esc(o.id)}</div>${(o.items||[]).map(i=>`<div class="line"><span>${esc(i.kr||i.name)}<br><span class="muted">${esc(i.name)}${i.variantName?'（'+esc(i.variantName)+'）':''} × ${i.qty}</span></span><b>₩${won(i.subtotal)}</b></div>`).join('')}<div class="line"><b>합계 / 合计</b><b>₩${won(o.total)}</b></div>${o.note?`<div class="muted">요청사항 / 备注：${esc(o.note)}</div>`:''}</div>`).join('')||'<p class="muted">현재 진행 중인 주문이 없습니다.<br>当前没有进行中的订单。</p>';
  }catch(e){
    console.error('order history load failed',e);
    myOrders.innerHTML='<p>주문 내역을 불러오지 못했습니다.<br>订单记录读取失败，请稍后重试。</p><button class="btn" onclick="openMyOrders()">다시 시도 / 重新加载</button>';
  }
}

[cartModal,variantModal,ordersModal].forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.style.display='none'}));
load();renderCart();
</script>
</body>
</html>
