<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>四季三餐｜사계삼찬</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif;padding-bottom:112px}header{position:sticky;top:0;z-index:30;background:#143e31;color:white;padding:14px 15px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.82}.table{float:right;background:#b47b20;padding:6px 10px;border-radius:20px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:10px}.cats{display:flex;gap:7px;overflow-x:auto;position:sticky;top:68px;background:#f5f3ef;padding:7px 0 10px;z-index:25;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:20px;padding:8px 13px;font-weight:800}.cat.on{background:#143e31;color:white}.section{scroll-margin-top:122px;margin:8px 0 18px}.section h2{font-size:19px;margin:10px 2px}.menu{display:grid;gap:9px}.dish{background:white;border-radius:14px;padding:10px;display:flex;gap:11px;position:relative;min-height:125px}.dish.soldout{filter:grayscale(1);opacity:.58}.soldbadge{position:absolute;right:10px;top:10px;background:#777;color:white;border-radius:14px;padding:4px 9px;font-size:12px;font-weight:900}.photo{width:105px;height:105px;flex:none;border-radius:11px;object-fit:cover;background:#eee;display:block}.photoWrap{width:105px;height:105px;flex:none;border-radius:11px;background:#eee;display:grid;place-items:center;font-size:34px;overflow:hidden}.info{flex:1}.name{font-weight:900;font-size:17px}.kr{font-size:12px;color:#777}.price{font-weight:900;margin-top:8px}.btn{border:0;border-radius:9px;padding:9px 11px;background:#143e31;color:#fff;font-weight:800}.btn:disabled{background:#999}.gold{background:#a87928}.cartbar{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #ddd;padding:9px 10px;display:flex;gap:8px;align-items:center;z-index:35}.cartbar .btn:last-child{margin-left:auto}.mybtn{background:#b47b20}.cart{background:#fff;border-radius:14px;padding:12px;margin-top:12px}.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee}.qty button{width:28px;height:28px;border:0;border-radius:50%;background:#143e31;color:#fff}.note{width:100%;min-height:65px;border:1px solid #ddd;border-radius:9px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.dialog{background:white;width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.variant{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin:7px 0;background:white}.muted{font-size:12px;color:#777}.ordercard{border:1px solid #e2e2e2;border-radius:12px;padding:12px;margin:9px 0}.status{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;background:#eee}.sNEW{background:#ffe1df;color:#a12b22}.sCOOKING{background:#fff0bd;color:#805900}.sDONE{background:#dff4e8;color:#176b42}.sPAID{background:#e5e5e5;color:#555}.sCANCELLED{background:#eee;color:#888}@media(min-width:700px){.menu{grid-template-columns:1fr 1fr}.modal{align-items:center;justify-content:center}.dialog{max-width:560px;border-radius:18px}}
</style>
</head>
<body>
<header><span id="tableBadge" class="table"></span><div class="brand">四季三餐 · 사계삼찬</div><div class="sub">扫码点餐 · QR 주문</div></header>
<main class="wrap"><div id="cats" class="cats"></div><div id="menuSections"></div><div class="cart"><h3>已选菜品 · 선택 메뉴</h3><div id="cart"></div><label>备注 · 요청사항</label><textarea id="note" class="note" placeholder="例如：不要香菜 · 예: 고수 빼주세요"></textarea></div></main>
<div class="cartbar"><button class="btn mybtn" onclick="openMyOrders()">我的订单 · 내 주문</button><div><b id="cartCount">0件 · 0개</b><br><span id="cartTotal">₩0</span></div><button class="btn" onclick="submitOrder()">提交订单 · 주문하기</button></div>
<div id="variantModal" class="modal"><div class="dialog"><h2 id="vmTitle"></h2><div id="vmList"></div><button class="btn" onclick="variantModal.style.display='none'">取消 · 취소</button></div></div>
<div id="ordersModal" class="modal"><div class="dialog"><h2>我的订单 · 내 주문</h2><div id="myOrders"></div><button class="btn" onclick="ordersModal.style.display='none'">关闭 · 닫기</button></div></div>
<script>
const $=id=>document.getElementById(id),won=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);let table=Math.min(20,Math.max(1,Number(q.get('table')||1))),menus=[],cartMap=new Map(),activeCat='',lastMenuSignature='';tableBadge.textContent=table+'号桌 · '+table+'번 테이블';
const prefCats=['主食','面类','饺子','凉菜','饮料','酒水','其他'];const catKr={'主食':'식사','面类':'면류','饺子':'만두','凉菜':'냉채','饮料':'음료','酒水':'주류','其他':'기타'};
function categoryOf(x){let c=String(x.category||'').trim(),n=(x.name||'')+' '+(x.kr||'');if(/饮料|饮品|可乐|雪碧|汽水|콜라|사이다/.test(c+n))return'饮料';if(/酒|啤|烧酒|맥주|소주/.test(c+n))return'酒水';if(/凉菜|冷菜|小菜|반찬|냉채/.test(c+n))return'凉菜';if(/饺|锅贴|馄饨|水饺|만두|완탕/.test(c+n))return'饺子';if(/面|면|자장/.test(c+n))return'面类';if(c&&prefCats.includes(c))return c;if(c&&/主食/.test(c))return'主食';return c||'主食'}
function catLabel(c){return esc(c)+' · '+esc(catKr[c]||'기타')}function keyOf(id,vid){return id+'::'+(vid||'')}
function stableMenuSignature(list){try{return JSON.stringify(list.map(x=>({id:x.id,name:x.name,kr:x.kr,price:x.price,category:x.category,on:x.on,image:x.image,emoji:x.emoji,variants:Array.isArray(x.variants)?x.variants.map(v=>({id:v.id,name:v.name,kr:v.kr,price:v.price,on:v.on})):[]})))}catch(e){return String(Date.now())}}
async function load(){try{let r=await fetch('/api/menu',{cache:'no-store'}),next=await r.json(),sig=stableMenuSignature(next);if(sig===lastMenuSignature)return;menus=next;lastMenuSignature=sig;renderAll()}catch(e){console.error('menu load failed',e)}}setInterval(load,5000);
function catsPresent(){let s=new Set(menus.map(categoryOf));return prefCats.filter(c=>s.has(c))}
function renderAll(){let cs=catsPresent();cats.innerHTML=cs.map((c,i)=>`<button class="cat ${(!activeCat&&i===0)||activeCat===c?'on':''}" onclick="jumpCat('${esc(c)}')">${catLabel(c)}</button>`).join('');menuSections.innerHTML=cs.map(c=>`<section id="cat-${encodeURIComponent(c)}" class="section"><h2>${catLabel(c)}</h2><div class="menu">${menus.filter(x=>categoryOf(x)===c).map(card).join('')}</div></section>`).join('')||'<p>暂无菜品 · 등록된 메뉴가 없습니다.</p>'}
function jumpCat(c){activeCat=c;[...document.querySelectorAll('.cat')].forEach(b=>b.classList.remove('on'));let buttons=[...document.querySelectorAll('.cat')],idx=catsPresent().indexOf(c);if(idx>=0&&buttons[idx])buttons[idx].classList.add('on');let el=document.getElementById('cat-'+encodeURIComponent(c));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function imageBlock(x){if(!x.image)return `<div class="photoWrap">${esc(x.emoji||'🍽️')}</div>`;return `<div class="photoWrap"><img class="photo" src="${esc(x.image)}" onerror="this.remove();this.parentElement.textContent='${esc(x.emoji||'🍽️')}'"></div>`}
function card(x){let sold=x.on===false,hasVariants=Array.isArray(x.variants)&&x.variants.length;let priceText=hasVariants?'₩'+won(Math.min(...x.variants.map(v=>Number(v.price||0))))+' 起 · 부터':'₩'+won(x.price);let buttonText=sold?'已售罄 · 품절':(hasVariants?'选择规格 · 옵션 선택':'加入 · 담기');return `<div class="dish ${sold?'soldout':''}">${sold?'<span class="soldbadge">已售罄 · 품절</span>':''}${imageBlock(x)}<div class="info"><div class="name">${esc(x.name)}</div><div class="kr">${esc(x.kr||'')}</div><div class="price">${priceText}</div><button class="btn" ${sold?'disabled':''} onclick="choose('${esc(x.id)}')">${buttonText}</button></div></div>`}
function choose(id){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;if(Array.isArray(x.variants)&&x.variants.length){vmTitle.textContent=(x.name||'')+' / '+(x.kr||'');vmList.innerHTML=x.variants.map(v=>`<button class="variant" onclick="add('${esc(x.id)}','${esc(v.id)}')"><span><b>${esc(v.name)} / ${esc(v.kr)}</b></span><b>₩${won(v.price)}</b></button>`).join('');variantModal.style.display='flex'}else add(id,'')}
function add(id,vid){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;let v=(x.variants||[]).find(a=>String(a.id)===String(vid)),k=keyOf(id,vid),old=cartMap.get(k);cartMap.set(k,{id:x.id,variantId:vid,name:x.name,kr:x.kr||'',variantName:v?.name||'',variantKr:v?.kr||'',price:Number(v?v.price:x.price||0),qty:(old?.qty||0)+1});variantModal.style.display='none';renderCart()}
function qty(k,d){let x=cartMap.get(k);if(!x)return;x.qty+=d;if(x.qty<=0)cartMap.delete(k);renderCart()}
function renderCart(){let a=[...cartMap.entries()];cart.innerHTML=a.map(([k,x])=>`<div class="line"><span>${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''}<br><span class="muted">${esc(x.kr||'')}${x.variantKr?'（'+esc(x.variantKr)+'）':''}</span><br><span class="muted">₩${won(x.price)} × ${x.qty}</span></span><span class="qty"><button onclick="qty('${esc(k)}',-1)">−</button> <b>${x.qty}</b> <button onclick="qty('${esc(k)}',1)">＋</button></span></div>`).join('')||'<span class="muted">还没有选择菜品 · 아직 선택한 메뉴가 없습니다.</span>';let count=a.reduce((s,[,x])=>s+x.qty,0),total=a.reduce((s,[,x])=>s+x.qty*x.price,0);cartCount.textContent=count+'件 · '+count+'개';cartTotal.textContent='₩'+won(total)}
function orderKey(){return 'sijisancan_orders_table_'+table}function savedIds(){try{return JSON.parse(localStorage.getItem(orderKey())||'[]')}catch{return[]}}function setSavedIds(ids){localStorage.setItem(orderKey(),JSON.stringify((ids||[]).filter(Boolean).slice(-50)))}function saveOrderId(id){let a=savedIds().filter(Boolean);if(!a.includes(id))a.push(id);setSavedIds(a)}
async function submitOrder(){let items=[...cartMap.values()].map(x=>({id:x.id,variantId:x.variantId,qty:x.qty}));if(!items.length)return alert('请先选择菜品。\n먼저 메뉴를 선택해 주세요.');if(!confirm('确认提交订单吗？\n주문을 제출하시겠습니까?'))return;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table,type:'DINE_IN',items,note:note.value})}),d=await r.json();if(!r.ok)return alert((d.error||'下单失败')+'\n주문에 실패했습니다.');if(d.id)saveOrderId(d.id);cartMap.clear();note.value='';renderCart();alert('下单成功！可在「我的订单」查看。\n주문이 완료되었습니다. 「내 주문」에서 확인할 수 있습니다.');openMyOrders()}
const statusText={NEW:'已下单 · 주문완료',COOKING:'制作中 · 조리 중',DONE:'已完成 · 조리 완료',PAID:'已结账 · 결제 완료',CANCELLED:'已取消 · 취소'};
async function openMyOrders(){ordersModal.style.display='flex';myOrders.innerHTML='<p class="muted">正在加载… · 불러오는 중…</p>';let ids=savedIds();if(!ids.length){myOrders.innerHTML='<p class="muted">本设备当前没有未结账订单。 · 현재 이 기기에는 미결제 주문이 없습니다.</p>';return}let r=await fetch('/api/customer/orders?ids='+encodeURIComponent(ids.join(',')),{cache:'no-store'}),a=await r.json();if(!r.ok||!Array.isArray(a)){myOrders.innerHTML='<p>读取订单失败，请稍后重试。 · 주문을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';return}let active=a.filter(o=>!['PAID','CANCELLED'].includes(o.status));setSavedIds(active.map(o=>o.id));myOrders.innerHTML=active.map(o=>`<div class="ordercard"><div><b>${o.table}号桌 · ${o.table}번 테이블</b>　<span class="status s${esc(o.status)}">${statusText[o.status]||o.status}</span></div><div class="muted">${new Date(o.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Seoul'})} · ${esc(o.id)}</div>${(o.items||[]).map(i=>`<div class="line"><span>${esc(i.name)}${i.variantName?'（'+esc(i.variantName)+'）':''} × ${i.qty}</span><b>₩${won(i.subtotal)}</b></div>`).join('')}<div class="line"><b>合计 · 합계</b><b>₩${won(o.total)}</b></div>${o.note?`<div class="muted">备注 · 요청사항：${esc(o.note)}</div>`:''}</div>`).join('')||'<p class="muted">本桌上一笔订单已结账，订单明细已清除。 · 이전 주문은 결제 완료되어 주문 내역이 초기화되었습니다.</p>'}
load();renderCart();
</script></body></html>
