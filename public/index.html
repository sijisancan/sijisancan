<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>四季三餐｜사계삼찬</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif;padding-bottom:105px}header{position:sticky;top:0;z-index:30;background:#143e31;color:white;padding:14px 15px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.8}.table{float:right;background:#b47b20;padding:6px 10px;border-radius:20px}.wrap{max-width:900px;margin:auto;padding:10px}.cats{display:flex;gap:7px;overflow-x:auto;position:sticky;top:68px;background:#f5f3ef;padding:7px 0 10px;z-index:25;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:20px;padding:8px 13px;font-weight:700}.cat.on{background:#143e31;color:white}.section{scroll-margin-top:122px;margin:8px 0 18px}.section h2{font-size:19px;margin:10px 2px}.menu{display:grid;gap:9px}.dish{background:white;border-radius:14px;padding:10px;display:flex;gap:11px;position:relative}.dish.soldout{filter:grayscale(1);opacity:.58}.soldbadge{position:absolute;right:10px;top:10px;background:#777;color:white;border-radius:14px;padding:4px 9px;font-size:12px;font-weight:900}.photo{width:105px;height:105px;flex:none;border-radius:11px;object-fit:cover;background:#eee;display:grid;place-items:center;font-size:34px}.info{flex:1}.name{font-weight:900;font-size:17px}.kr{font-size:12px;color:#777}.price{font-weight:900;margin-top:8px}.btn{border:0;border-radius:9px;padding:9px 11px;background:#143e31;color:#fff;font-weight:800}.btn:disabled{background:#999}.gold{background:#a87928}.cartbar{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #ddd;padding:9px 10px;display:flex;gap:8px;align-items:center;z-index:35}.cartbar .btn{margin-left:auto}.mybtn{background:#b47b20}.cart{background:#fff;border-radius:14px;padding:12px;margin-top:12px}.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee}.qty button{width:28px;height:28px;border:0;border-radius:50%;background:#143e31;color:#fff}.note{width:100%;min-height:65px;border:1px solid #ddd;border-radius:9px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.dialog{background:white;width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.variant{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin:7px 0;background:white}.muted{font-size:12px;color:#777}.ordercard{border:1px solid #e2e2e2;border-radius:12px;padding:12px;margin:9px 0}.status{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;background:#eee}.sNEW{background:#ffe1df;color:#a12b22}.sCOOKING{background:#fff0bd;color:#805900}.sDONE{background:#dff4e8;color:#176b42}.sPAID{background:#e5e5e5;color:#555}.sCANCELLED{background:#eee;color:#888}@media(min-width:700px){.menu{grid-template-columns:1fr 1fr}.modal{align-items:center;justify-content:center}.dialog{max-width:560px;border-radius:18px}}
</style></head><body><header><span id="tableBadge" class="table"></span><div class="brand">四季三餐 · 사계삼찬</div><div class="sub">扫码点餐 · QR 주문</div></header><main class="wrap"><div id="cats" class="cats"></div><div id="menuSections"></div><div class="cart"><h3>已选菜品 / 선택 메뉴</h3><div id="cart"></div><label>备注 / 요청사항</label><textarea id="note" class="note" placeholder="例如：不要香菜 / 고수 빼주세요"></textarea></div></main><div class="cartbar"><button class="btn mybtn" onclick="openMyOrders()">我的订单</button><div><b id="cartCount">0件</b><br><span id="cartTotal">₩0</span></div><button class="btn" onclick="submitOrder()">提交订单</button></div><div id="variantModal" class="modal"><div class="dialog"><h2 id="vmTitle"></h2><div id="vmList"></div><button class="btn" onclick="variantModal.style.display='none'">取消</button></div></div><div id="ordersModal" class="modal"><div class="dialog"><h2>我的订单 / 내 주문</h2><div id="myOrders"></div><button class="btn" onclick="ordersModal.style.display='none'">关闭</button></div></div>
<script>
const $=id=>document.getElementById(id),won=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);let table=Math.min(20,Math.max(1,Number(q.get('table')||1))),menus=[],cartMap=new Map(),activeCat='';tableBadge.textContent=table+'号桌';
const prefCats=['主食','面类','饺子','凉菜','饮料','酒水','其他'];
function categoryOf(x){let c=String(x.category||'').trim(),n=(x.name||'')+' '+(x.kr||'');if(/饮料|饮品|可乐|雪碧|汽水|콜라|사이다/.test(c+n))return'饮料';if(/酒|啤|烧酒|맥주|소주/.test(c+n))return'酒水';if(/凉菜|冷菜|小菜|반찬|냉채/.test(c+n))return'凉菜';if(/饺|锅贴|馄饨|水饺|만두|완탕/.test(c+n))return'饺子';if(/面|면|자장/.test(c+n))return'面类';if(c&&prefCats.includes(c))return c;if(c&&/主食/.test(c))return'主食';return c||'主食'}
function keyOf(id,vid){return id+'::'+(vid||'')}
async function load(){let r=await fetch('/api/menu',{cache:'no-store'});menus=await r.json();renderAll()}setInterval(load,5000);
function catsPresent(){let s=new Set(menus.map(categoryOf));return prefCats.filter(c=>s.has(c))}
function renderAll(){let cs=catsPresent();cats.innerHTML=cs.map((c,i)=>`<button class="cat ${(!activeCat&&i===0)||activeCat===c?'on':''}" onclick="jumpCat('${esc(c)}')">${esc(c)}</button>`).join('');menuSections.innerHTML=cs.map(c=>`<section id="cat-${encodeURIComponent(c)}" class="section"><h2>${esc(c)}</h2><div class="menu">${menus.filter(x=>categoryOf(x)===c).map(card).join('')}</div></section>`).join('')||'<p>暂无菜品</p>'}
function jumpCat(c){activeCat=c;renderAll();let el=document.getElementById('cat-'+encodeURIComponent(c));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function card(x){let sold=x.on===false;return `<div class="dish ${sold?'soldout':''}">${sold?'<span class="soldbadge">已售罄 / 품절</span>':''}${x.image?`<img class="photo" src="${esc(x.image)}" onerror="this.style.display='none'">`:`<div class="photo">${esc(x.emoji||'🍽️')}</div>`}<div class="info"><div class="name">${esc(x.name)}</div><div class="kr">${esc(x.kr||'')}</div><div class="price">${Array.isArray(x.variants)&&x.variants.length?'₩'+won(Math.min(...x.variants.map(v=>Number(v.price||0))))+' 起':'₩'+won(x.price)}</div><button class="btn" ${sold?'disabled':''} onclick="choose('${esc(x.id)}')">${sold?'已售罄':(x.variants?.length?'选择规格':'加入')}</button></div></div>`}
function choose(id){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;if(Array.isArray(x.variants)&&x.variants.length){vmTitle.textContent=x.name+' / '+x.kr;vmList.innerHTML=x.variants.map(v=>`<button class="variant" onclick="add('${esc(x.id)}','${esc(v.id)}')"><span><b>${esc(v.name)} / ${esc(v.kr)}</b></span><b>₩${won(v.price)}</b></button>`).join('');variantModal.style.display='flex'}else add(id,'')}
function add(id,vid){let x=menus.find(m=>String(m.id)===String(id));if(!x||x.on===false)return;let v=(x.variants||[]).find(a=>String(a.id)===String(vid)),k=keyOf(id,vid),old=cartMap.get(k);cartMap.set(k,{id:x.id,variantId:vid,name:x.name,variantName:v?.name||'',price:Number(v?v.price:x.price||0),qty:(old?.qty||0)+1});variantModal.style.display='none';renderCart()}
function qty(k,d){let x=cartMap.get(k);if(!x)return;x.qty+=d;if(x.qty<=0)cartMap.delete(k);renderCart()}
function renderCart(){let a=[...cartMap.entries()];cart.innerHTML=a.map(([k,x])=>`<div class="line"><span>${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''}<br><span class="muted">₩${won(x.price)} × ${x.qty}</span></span><span class="qty"><button onclick="qty('${esc(k)}',-1)">−</button> <b>${x.qty}</b> <button onclick="qty('${esc(k)}',1)">＋</button></span></div>`).join('')||'<span class="muted">还没有选择菜品</span>';let count=a.reduce((s,[,x])=>s+x.qty,0),total=a.reduce((s,[,x])=>s+x.qty*x.price,0);cartCount.textContent=count+'件';cartTotal.textContent='₩'+won(total)}
function orderKey(){return 'sijisancan_orders_table_'+table}function savedIds(){try{return JSON.parse(localStorage.getItem(orderKey())||'[]')}catch{return[]}}function saveOrderId(id){let a=savedIds().filter(Boolean);if(!a.includes(id))a.push(id);localStorage.setItem(orderKey(),JSON.stringify(a.slice(-50)))}
async function submitOrder(){let items=[...cartMap.values()].map(x=>({id:x.id,variantId:x.variantId,qty:x.qty}));if(!items.length)return alert('请先选择菜品');let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table,type:'DINE_IN',items,note:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'下单失败');if(d.id)saveOrderId(d.id);cartMap.clear();note.value='';renderCart();alert('下单成功！可在「我的订单」查看。');openMyOrders()}
const statusText={NEW:'已下单 / 주문완료',COOKING:'制作中 / 조리중',DONE:'已完成 / 완료',PAID:'已结账 / 결제완료',CANCELLED:'已取消 / 취소'};
async function openMyOrders(){ordersModal.style.display='flex';myOrders.innerHTML='<p class="muted">正在加载…</p>';let ids=savedIds();if(!ids.length){myOrders.innerHTML='<p class="muted">本设备还没有下单记录。</p>';return}let r=await fetch('/api/customer/orders?ids='+encodeURIComponent(ids.join(',')),{cache:'no-store'}),a=await r.json();if(!r.ok||!Array.isArray(a)){myOrders.innerHTML='<p>读取订单失败，请稍后重试。</p>';return}myOrders.innerHTML=a.map(o=>`<div class="ordercard"><div><b>${o.table}号桌</b>　<span class="status s${esc(o.status)}">${statusText[o.status]||o.status}</span></div><div class="muted">${new Date(o.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Seoul'})} · ${esc(o.id)}</div>${(o.items||[]).map(i=>`<div class="line"><span>${esc(i.name)}${i.variantName?'（'+esc(i.variantName)+'）':''} × ${i.qty}</span><b>₩${won(i.subtotal)}</b></div>`).join('')}<div class="line"><b>合计</b><b>₩${won(o.total)}</b></div>${o.note?`<div class="muted">备注：${esc(o.note)}</div>`:''}</div>`).join('')||'<p class="muted">暂时没有订单。</p>'}
load();renderCart();
</script></body></html>
