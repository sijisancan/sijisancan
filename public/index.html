<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四季三餐｜사계삼찬</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#18251e;color:#fff;padding:22px 16px}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;opacity:.8;margin-top:4px}.table{display:inline-block;background:#b33a2f;padding:7px 12px;border-radius:20px;margin-top:13px;font-size:13px}main{max-width:720px;margin:auto;padding:15px 14px 105px}.notice{background:#fff;padding:13px;border-radius:13px;font-size:13px}.cat{font-size:19px;font-weight:800;margin:21px 3px 9px}.card{background:#fff;border-radius:15px;padding:13px;margin:8px 0;display:flex;gap:12px;align-items:center}.pic{width:68px;height:68px;border-radius:12px;background:#eee8de;display:grid;place-items:center;font-size:31px}.info{flex:1}.name{font-weight:800}.kr{font-size:12px;color:#777}.price{font-weight:800;margin-top:6px}.add{border:0;background:#b33a2f;color:#fff;border-radius:50%;width:34px;height:34px;font-size:22px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#fff;border-top:1px solid #ddd}.btn{width:100%;max-width:720px;display:block;margin:auto;border:0;border-radius:12px;height:51px;background:#18251e;color:#fff;font-weight:800;font-size:16px}.overlay{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:5}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.qty button{width:29px;height:29px}.qty span{display:inline-block;width:25px;text-align:center}.total{text-align:right;font-size:19px;font-weight:800;margin:18px 0}.submit{width:100%;height:50px;border:0;border-radius:12px;background:#b33a2f;color:#fff;font-weight:800}.close{float:right;border:0;border-radius:50%;width:30px;height:30px}.type{display:flex;gap:8px;margin:10px 0}.type button{flex:1;padding:11px;border:1px solid #ddd;background:#fff;border-radius:9px}.type .on{background:#18251e;color:#fff}
</style></head><body><header><div class="brand">四季三餐 · 사계삼찬</div><div class="sub">정성으로 만든 중국식 수제요리</div><div class="table" id="table"></div></header><main><div class="notice">📱 메뉴를 선택해 주세요. 주문 후 직원이 확인합니다.</div><div id="menu"></div></main><div class="bottom"><button class="btn" onclick="openCart()">🛒 주문 확인 · <span id="count">0</span>개</button></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()"><div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>주문 확인</h2><div class="type"><button id="dine" class="on" onclick="setType('DINE_IN')">매장식사</button><button id="take" onclick="setType('TAKEOUT')">포장</button></div><div id="cart"></div><div class="total">합계 ₩<span id="total">0</span></div><input id="note" placeholder="요청사항 (선택)" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px"><button class="submit" onclick="submitOrder()">주문하기</button></div></div>
<script>
let table=Number(new URLSearchParams(location.search).get("table"))||1,menu=[],cart={},type="DINE_IN";document.getElementById("table").textContent=`${table}번 테이블 · ${table}号桌`;
const won=n=>Number(n).toLocaleString("ko-KR");async function init(){menu=await fetch("/api/menu").then(r=>r.json());render()}
function render(){document.getElementById("menu").innerHTML=`<div class="cat">대표 메뉴 · 主打</div>`+menu.map((x,i)=>`<div class="card"><div class="pic">${x[4]||x.emoji}</div><div class="info"><div class="name">${x.name}</div><div class="kr">${x.kr}</div><div class="price">₩${won(x.price)}</div></div><button class="add" onclick="add(${i})">+</button></div>`).join("")}
function add(i){cart[menu[i].id]=(cart[menu[i].id]||0)+1;update()}function update(){document.getElementById("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){document.getElementById("overlay").style.display="flex";renderCart()}function closeCart(){document.getElementById("overlay").style.display="none"}function setType(t){type=t;dine.className=t==="DINE_IN"?"on":"";take.className=t==="TAKEOUT"?"on":""}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];update();renderCart()}function renderCart(){let total=0,h="";Object.entries(cart).forEach(([id,q])=>{let x=menu.find(z=>z.id===id);total+=x.price*q;h+=`<div class="row"><div><b>${x.name}</b><br><small>${x.kr} · ₩${won(x.price)}</small></div><div class="qty"><button onclick="change('${id}',-1)">−</button><span>${q}</span><button onclick="change('${id}',1)">＋</button></div></div>`});document.getElementById("cart").innerHTML=h||"선택한 메뉴가 없습니다.";document.getElementById("total").textContent=won(total)}
async function submitOrder(){if(!Object.keys(cart).length)return alert("메뉴를 선택해 주세요.");let items=Object.entries(cart).map(([id,qty])=>({id,qty})),r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table,items,note:note.value,type})});if(r.ok){alert("주문이 접수되었습니다!");cart={};update();note.value="";closeCart()}else alert("주문에 실패했습니다.")}
init();
</script></body></html>
