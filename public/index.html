<body>

<header>

  <div class="brand">
    四季三餐 · 사계삼찬
  </div>

  <div class="sub">
    정성으로 만든 중국식 수제요리
  </div>

  <div class="table" id="tableBadge">
    테이블 확인 중...
  </div>

</header>


<main>

  <div class="notice">
    📱 메뉴를 선택해 주세요。<br>
    메뉴를 선택한 후 주문을 확인하고 주문하기를 눌러주세요.
  </div>

  <div id="menu">
    <div class="loading">
      메뉴를 불러오는 중입니다...
    </div>
  </div>

</main>


<div class="bottom">

  <button
    class="btn"
    id="cartButton"
    onclick="openCart()"
  >
    🛒 주문 확인 ·
    <span
      id="count"
      class="cart-count"
    >0</span>
    개
  </button>

</div>


<div
  class="overlay"
  id="overlay"
  onclick="handleOverlayClick(event)"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>주문 확인</h2>

      <button
        class="close"
        onclick="closeCart()"
        aria-label="닫기"
      >
        ×
      </button>

    </div>


    <div class="type">

      <button
        id="dine"
        class="on"
        onclick="setType('DINE_IN')"
      >
        🍚 매장식사
      </button>

      <button
        id="take"
        onclick="setType('TAKEOUT')"
      >
        🥡 포장
      </button>

    </div>


    <div
      id="cart"
      class="cart-list"
    ></div>


    <div class="total">
      합계 ₩<span id="total">0</span>
    </div>

      요청사항 / 요청사항
    </label>

      id="note"
      class="note"
      maxlength="200"
      placeholder="예: 고수 빼주세요 / 덜 맵게 해주세요"
    ></textarea>


    <button
      id="submitButton"
      class="submit"
      onclick="submitOrder()"
    >
      주문하기
    </button>

  </div>

</div>


<script>

let table = 1;

let menu = [];

let cart = {};

let type = "DINE_IN";

let submitting = false;

let orderSuccess = false;


/* ==============================
   工具
   ============================== */

function won(number){

  return Number(number || 0)
    .toLocaleString("ko-KR");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
   获取桌号
   ============================== */

function getTable(){

  const params =
    new URLSearchParams(
      location.search
    );

  const value =
    Number(params.get("table"));

  if(
    Number.isFinite(value) &&
    value >= 1 &&
    value <= 30
  ){

    return Math.floor(value);

  }

  return 1;

}


/* ==============================
   初始化
   ============================== */

async function init(){

  table = getTable();

  document
    .getElementById("tableBadge")
    .textContent =
      `${table}번 테이블 · ${table}号桌`;

  try{

    const response =
      await fetch("/api/menu",{
        cache:"no-store"
      });

    if(!response.ok){

      throw new Error(
        "菜单加载失败"
      );

    }

    menu =
      await response.json();

    renderMenu();

  }catch(error){

    console.error(error);

    document
      .getElementById("menu")
      .innerHTML = `
        <div class="error">
          菜单加载失败，请刷新页面重试。<br>
          메뉴를 불러오지 못했습니다.
        </div>
      `;

  }

}


/* ==============================
   菜单
   ============================== */

function renderMenu(){

  const container =
    document.getElementById("menu");

  if(!Array.isArray(menu) || !menu.length){

    container.innerHTML = `
      <div class="empty">
        暂无可点菜品<br>
        주문 가능한 메뉴가 없습니다.
      </div>
    `;

    return;

  }

  container.innerHTML = `
    <div class="cat">
      대표 메뉴 · 主打
    </div>

    ${menu.map((item,index)=>{

      const emoji =
        escapeHtml(
          item.emoji || "🍽️"
        );

      const name =
        escapeHtml(
          item.name || "未命名菜品"
        );

      const kr =
        escapeHtml(
          item.kr || ""
        );

      const price =
        won(item.price);

      return `

        <div class="card">

          <div class="pic">
            ${emoji}
          </div>

          <div class="info">

            <div class="name">
              ${name}
            </div>

            ${
              kr
                ? `<div class="kr">${kr}</div>`
                : ""
            }

            <div class="price">
              ₩${price}
            </div>

          </div>

          <button
            class="add"
            onclick="add(${index})"
            aria-label="添加"
          >
            +
          </button>

        </div>

      `;

    }).join("")}
  `;

}


/* ==============================
   加入购物车
   ============================== */

function add(index){

  const item = menu[index];

  if(!item) return;

  const id = item.id;

  cart[id] =
    Math.min(
      99,
      (cart[id] || 0) + 1
    );

  updateCount();

}


/* ==============================
   数量修改
   ============================== */

function change(id, delta){

  if(!cart[id]) return;

  cart[id] += delta;

  if(cart[id] <= 0){

    delete cart[id];

  }

  updateCount();

  renderCart();

}


/* ==============================
   购物车数量
   ============================== */

function getCartCount(){

  return Object.values(cart)
    .reduce(
      (sum, qty) =>
        sum + Number(qty || 0),
      0
    );

}


function updateCount(){

  document
    .getElementById("count")
    .textContent =
      getCartCount();

}


/* ==============================
   打开购物车
   ============================== */

function openCart(){

  document
    .getElementById("overlay")
    .classList.add("show");

  renderCart();

}


/* ==============================
   关闭购物车
   ============================== */

function closeCart(){

  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* ==============================
   点击背景关闭
   ============================== */

function handleOverlayClick(event){

  if(
    event.target.id === "overlay"
  ){

    closeCart();

  }

}


/* ==============================
   堂食 / 打包
   ============================== */

function setType(value){

  type = value;

  document
    .getElementById("dine")
    .className =
      value === "DINE_IN"
        ? "on"
        : "";

  document
    .getElementById("take")
    .className =
      value === "TAKEOUT"
        ? "on"
        : "";

}


/* ==============================
   渲染购物车
   ============================== */

function renderCart(){

  const container =
    document.getElementById("cart");

  let total = 0;

  const entries =
    Object.entries(cart);

  if(!entries.length){

    container.innerHTML = `
      <div class="empty-cart">
        选择的菜单为空<br>
        선택한 메뉴가 없습니다.
      </div>
    `;

    document
      .getElementById("total")
      .textContent = "0";

    return;

  }


  let html = "";

  entries.forEach(
    ([id, quantity])=>{

      const item =
        menu.find(
          x => x.id === id
        );

      if(!item) return;

      const qty =
        Number(quantity) || 0;

      const price =
        Number(item.price) || 0;

      total +=
        price * qty;

      html += `

        <div class="row">

          <div class="row-info">

            <div class="row-name">
              ${escapeHtml(
                item.name
              )}
            </div>

            <div class="row-detail">
              ${escapeHtml(
                item.kr || ""
              )}
              · ₩${won(price)}
            </div>

          </div>

          <div class="qty">

            <button
              onclick="change('${escapeHtml(id)}',-1)"
            >
              −
            </button>

            <span>
              ${qty}
            </span>

            <button
              onclick="change('${escapeHtml(id)}',1)"
            >
              ＋
            </button>

          </div>

        </div>

      `;

    }
  );


  container.innerHTML = html;

  document
    .getElementById("total")
    .textContent =
      won(total);

}


/* ==============================
   创建订单
   ============================== */

async function submitOrder(){

  if(submitting){

    return;

  }


  if(
    !Object.keys(cart).length
  ){

    alert(
      "메뉴를 선택해 주세요.\n请先选择菜品。"
    );

    return;

  }


  const items =
    Object.entries(cart)
      .map(
        ([id,qty])=>({

          id,

          qty:
            Math.min(
              99,
              Math.max(
                1,
                Math.floor(
                  Number(qty) || 1
                )
              )
            )

        })
      );


  const note =
    document
      .getElementById("note")
      .value
      .trim();


  submitting = true;


  const button =
    document
      .getElementById(
        "submitButton"
      );

  button.disabled = true;

  button.textContent =
    "订单提交中...";


  try{

    const response =
      await fetch(
        "/api/orders",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              table,

              items,

              note,

              type

            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "订单提交失败"
      );

    }


    /*
     * 订单提交成功
     */

    cart = {};

    updateCount();

    showSuccess(
      data
    );


  }catch(error){

    console.error(error);

    alert(
      "订单提交失败，请检查网络后重试。\n" +
      "주문에 실패했습니다."
    );

  }finally{

    submitting = false;

    button.disabled = false;

    button.textContent =
      "주문하기";

  }

}


/* ==============================
   成功页面
   ============================== */

function showSuccess(order){

  orderSuccess = true;

  const sheet =
    document.querySelector(
      ".sheet"
    );

  const orderId =
    escapeHtml(
      order?.id || ""
    );

  const total =
    won(order?.total || 0);

  sheet.innerHTML = `

    <div class="success">

      <div class="success-icon">
        ✅
      </div>

      <h2>
        주문이 접수되었습니다
      </h2>

      <p>
        주문이 정상적으로 접수되었습니다.<br>
        직원이 확인 후 준비해 드립니다.
      </p>

      <div class="success-order">

        주문번호 · ${orderId}<br>

        테이블 · ${table}号桌<br>

        합계 · ₩${total}

      </div>

      <button
        class="submit"
        onclick="finishSuccess()"
      >
        메뉴로 돌아가기
      </button>

    </div>

  `;

}


/* ==============================
   成功后返回菜单
   ============================== */

function finishSuccess(){

  const sheet =
    document.querySelector(
      ".sheet"
    );

  sheet.innerHTML = `

    <div class="sheet-head">

      <h2>주문 확인</h2>

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>

    <div class="type">

      <button
        id="dine"
        class="on"
        onclick="setType('DINE_IN')"
      >
        🍚 매장식사
      </button>

      <button
        id="take"
        onclick="setType('TAKEOUT')"
      >
        🥡 포장
      </button>

    </div>

    <div
      id="cart"
      class="cart-list"
    ></div>

    <div class="total">
      합계 ₩
      <span id="total">0</span>
    </div>

    <label class="note-label">
      요청사항 / 요청사항
    </label>

    <textarea
      id="note"
      class="note"
      maxlength="200"
      placeholder="예: 고수 빼주세요 / 덜 맵게 해주세요"
    ></textarea>

    <button
      id="submitButton"
      class="submit"
      onclick="submitOrder()"
    >
      주문하기
    </button>

  `;

  orderSuccess = false;

  renderCart();

}


/* ==============================
   初始化
   ============================== */

init();

</script>

</body>
</html>
