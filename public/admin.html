<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四季三餐 V7.3 营业后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:9;background:#173c2e;color:#fff;padding:13px 16px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.8}.wrap{max-width:1220px;margin:auto;padding:12px}.login{max-width:420px;margin:70px auto;background:#fff;border-radius:16px;padding:24px}.field{width:100%;padding:11px;border:1px solid #d9d9d9;border-radius:9px;margin:5px 0 10px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#173c2e;color:#fff;font-weight:800;cursor:pointer}.gray{background:#777}.red{background:#ad3d32}.gold{background:#a8781f}.blue{background:#28628e}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat,.panel{background:#fff;border-radius:13px;padding:12px}.stat b{display:block;font-size:21px;margin-top:3px}.panel{margin-top:10px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tables{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.tablebox{border:2px solid transparent;border-radius:10px;padding:10px 3px;text-align:center;background:#eee;font-size:12px;cursor:pointer}.tablebox b{font-size:16px}.tablebox.NEW{background:#ffd9d5}.tablebox.COOKING{background:#ffe8c4}.tablebox.DONE{background:#cfeadd}.tablebox.sel{border-color:#173c2e}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:9px}.order{border:1px solid #eee;border-left:6px solid #bbb;border-radius:12px;padding:12px}.order.NEW{border-left-color:#b63e34}.order.COOKING{border-left-color:#d88d29}.order.DONE{border-left-color:#2f8068}.head{display:flex;justify-content:space-between;font-size:17px;font-weight:900}.muted{font-size:12px;color:#777}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.note{background:#fff1c7;border-radius:8px;padding:8px;margin-top:6px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button{border:0;border-radius:7px;padding:8px}.print{font-size:12px;margin-top:6px}.menurow{display:grid;grid-template-columns:75px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.menuimg{width:72px;height:60px;object-fit:cover;border-radius:9px;background:#eee;display:grid;place-items:center;font-size:26px}.menuactions{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;border-radius:14px;background:#e5f3eb;font-size:12px}.badge.off{background:#ffd8d4}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:12px}.dialog{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:17px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.variant{display:grid;grid-template-columns:1fr 1fr 120px auto auto;gap:6px;align-items:center;margin:6px 0}.optionGroup{border:1px solid #d9d9d9;border-radius:12px;padding:10px;margin:10px 0;background:#fafafa}.optionHead{display:grid;grid-template-columns:1fr 1fr 120px auto auto;gap:6px;align-items:center}.optionRow{display:grid;grid-template-columns:1fr 1fr 110px auto;gap:6px;align-items:center;margin-top:6px;padding-left:12px}.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.qrs div{text-align:center}.qrs img{width:115px;max-width:100%}.staffgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.staffitem{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}.staffitem b{display:block}.staffqty{display:flex;align-items:center;gap:8px;margin-top:7px}.staffqty button{width:34px;height:30px;border:0;border-radius:7px}.storagewarn{background:#fff0c9;border:1px solid #e1b84b;border-radius:10px;padding:10px;margin-bottom:10px}.storageok{background:#e2f3e8;border:1px solid #78ad88;border-radius:10px;padding:10px;margin-bottom:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.tables{grid-template-columns:repeat(5,1fr)}.orders{grid-template-columns:1fr}.menurow{grid-template-columns:64px 1fr}.menuactions{grid-column:1/-1}.toolbar .btn{flex:1 1 45%}.row2{grid-template-columns:1fr}.variant{grid-template-columns:1fr 1fr}.variant .wide{grid-column:1/-1}}@media(max-width:650px){.staffgrid{grid-template-columns:1fr}}@media(max-width:430px){.wrap{padding:8px}.tables{gap:5px}.tablebox{padding:8px 2px}.stat{padding:9px}}

.stat.clickable{cursor:pointer;border:2px solid #d8eadf}.stat.clickable:hover{background:#eef8f1}.salesbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.salesbar input{padding:8px 10px;border:1px solid #ccc;border-radius:8px}.salesgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}.salesitem{border:1px solid #e4e4e4;border-radius:10px;padding:10px;background:#fafafa}.salesitem .num{font-size:22px;font-weight:900}.detailcard{border:1px solid #e4e4e4;border-radius:11px;padding:11px;margin:8px 0}.detailhead{display:flex;justify-content:space-between;gap:8px;font-weight:900}.statuspill{display:inline-block;border-radius:12px;padding:3px 7px;font-size:12px;background:#eee}.summaryline{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-weight:800}
.staffcustom{border:1px solid #ddd;border-radius:12px;padding:10px;margin:8px 0;background:#fafafa}.staffcustom h4{margin:0 0 6px}.staffopt{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.staffopt:last-child{border-bottom:0}.staffsel{font-size:12px;color:#666;margin-top:4px}
</style></head><body><header><div class="brand">四季三餐 · 사계삼찬</div><div class="sub">V7.2.4 营业版｜历史日期修复 · 新单声音增强 · 员工手动点单</div></header><div id="app" class="wrap"></div>
<div id="menuModal" class="modal"><div class="dialog"><h2 id="modalTitle">菜品设置</h2><input id="eId" type="hidden"><label>中文菜名</label><input id="eName" class="field"><label>韩文菜名</label><input id="eKr" class="field"><div class="row2"><div><label>基础价格（无规格时使用）</label><input id="ePrice" class="field" type="number"></div><div><label>分类</label><input id="eCat" class="field"></div></div><label>Emoji</label><input id="eEmoji" class="field" value="🍽️"><label>菜品图片</label><input id="eImage" class="field" type="file" accept="image/*"><h3>大小份 / 规格</h3><p class="muted">有规格时，顾客必须选择规格；勾选“无限续面”后，该规格可免费追加面。</p><div id="variants"></div><button class="btn blue" onclick="addVariant()">＋ 添加规格</button><h3 style="margin-top:18px">自定义选项 / 추가 옵션</h3><p class="muted">例如：辣度（单选必选）、加粉条/加菜（多选，可设置加价）。</p><div id="optionGroups"></div><button class="btn blue" type="button" onclick="addOptionGroup()">＋ 添加选项组</button><div style="display:flex;gap:8px;margin-top:15px"><button id="saveMenuBtn" class="btn" onclick="saveMenu()">保存</button><button class="btn gray" onclick="closeMenu()">取消</button></div></div></div>
<div id="staffModal" class="modal"><div class="dialog"><h2>🧾 员工手动点单 / 직원 주문</h2><div class="row2"><div><label>桌号</label><select id="staffTable" class="field"></select></div><div><label>类型</label><select id="staffType" class="field" onchange="staffTypeChanged()"><option value="DINE_IN">堂食 / 매장</option><option value="TAKEOUT">外带 / 포장</option></select></div></div><label>菜品</label><div id="staffMenu" class="staffgrid"></div><label style="display:block;margin-top:12px">备注 / 요청사항</label><textarea id="staffNote" class="field" rows="3" placeholder="例如：不要香菜 / 고수 빼주세요"></textarea><div style="font-size:20px;font-weight:900;margin:10px 0">合计：₩<span id="staffTotal">0</span></div><div style="display:flex;gap:8px"><button id="staffSubmit" class="btn" onclick="submitStaffOrder()">确认下单 / 주문 등록</button><button class="btn gray" onclick="closeStaffOrder()">取消</button></div></div></div>

<div id="todayOrdersModal" class="modal"><div class="dialog"><div class="panelhead"><h2>📋 今日订单明细</h2><button class="btn gray" onclick="closeTodayOrders()">关闭</button></div><div id="todayOrdersList"></div></div></div>

<div id="staffCustomModal" class="modal"><div class="dialog">
  <h2 id="staffCustomTitle">菜品选项</h2>
  <div id="staffCustomBody"></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn gray" style="flex:1" onclick="closeStaffCustom()">取消</button>
    <button class="btn" style="flex:1" onclick="confirmStaffCustom()">加入</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), won=n=>Number(n||0).toLocaleString('ko-KR'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer=null,known=new Set(),knownReady=false,soundOn=true,selectedTable=0,menuCache=[],staffCart={},audioCtx=null;
async function unlockAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx.state==='running'}catch(e){console.warn('audio unlock failed',e);return false}}
async function beep(){if(!soundOn)return;try{let a=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx=a;if(a.state==='suspended')await a.resume();let now=a.currentTime;[0,0.22,0.44].forEach((d,i)=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(i===1?1120:900,now+d);g.gain.setValueAtTime(0.0001,now+d);g.gain.exponentialRampToValueAtTime(0.22,now+d+0.015);g.gain.exponentialRampToValueAtTime(0.0001,now+d+0.16);o.start(now+d);o.stop(now+d+0.18)});}catch(e){console.warn('beep failed',e)}}
async function testSound(){soundOn=true;await unlockAudio();await beep();if(window.soundBtn)soundBtn.textContent='🔊 新单声音：开'}
function loginView(){clearInterval(timer);app.innerHTML=`<div class="login"><h2>营业后台登录</h2><input id="pw" class="field" type="password" placeholder="后台密码"><button class="btn" onclick="login()">登录</button></div>`}
async function login(){await unlockAudio();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(!r.ok)return alert('密码错误');showApp()}
async function showApp(){app.innerHTML=`<div id="storageState"></div><div class="toolbar"><button class="btn" onclick="refreshAll()">刷新</button><button class="btn" onclick="openStaffOrder('DINE_IN')">🍽️ 堂食点单</button><button class="btn gold" onclick="openStaffOrder('TAKEOUT')">🥡 打包外带</button><button class="btn gold" onclick="openMenu()">＋ 新增菜品</button><button class="btn blue" onclick="location.href='/history.html'">📜 订单历史</button><button id="soundBtn" class="btn gray" onclick="toggleSound()">🔊 新单声音：开</button><button class="btn gray" onclick="testSound()">🔔 测试声音</button><button class="btn gray" onclick="logout()">退出</button></div><div id="stats" class="stats"></div><div class="panel"><div class="panelhead"><h3>📊 菜品销量统计</h3><span class="muted">按已结账订单统计实际销量</span></div><div class="salesbar"><label>日期 <input id="salesDate" type="date"></label><button class="btn blue" onclick="loadSalesStats()">查询销量</button><span id="salesTotals" class="muted"></span></div><div id="salesList" class="salesgrid"></div></div><div class="panel"><div class="panelhead"><h3>🪑 20桌实时状态</h3><span class="muted">点击桌号可筛选；红=新单 黄=制作中 绿=完成待结账</span></div><div id="tables" class="tables"></div></div><div class="panel"><div class="panelhead"><h3>正在制作</h3><span class="muted">完成后自动从这里消失</span></div><div id="orders" class="orders"></div></div><div class="panel"><div class="panelhead"><h3>✅ 已完成 · 待结账</h3><span class="muted">结账后进入历史记录</span></div><div id="doneOrders" class="orders"></div></div><div class="panel"><div class="panelhead"><h3>菜单管理</h3><span class="muted">支持大小份、不同价格、无限续面、售罄和图片</span></div><div id="menus"></div></div><details class="panel"><summary><b>20张桌子二维码</b></summary><div id="qrs" class="qrs"></div></details>`;for(let i=1;i<=20;i++)qrs.innerHTML+=`<div><img src="/api/qr?table=${i}"><br><b>${i}号桌</b></div>`;salesDate.value=koreaToday();await refreshAll();await loadSalesStats();checkStorage();clearInterval(timer);timer=setInterval(refreshOrders,3000)}
async function checkStorage(){try{let r=await fetch('/api/storage-status');if(!r.ok)return;let d=await r.json();let el=$('storageState');if(!el)return;el.className=d.persistent?'storageok':'storagewarn';el.innerHTML=d.persistent?'✅ <b>数据持久化目录已启用</b>：菜单、价格、订单和新上传照片会写入持久磁盘。':'⚠️ <b>当前没有启用持久磁盘。</b> 菜单、价格和新照片在 Render 重启/重新部署后仍可能丢失。请按 V7 部署说明设置 Persistent Disk 和 DATA_DIR。'}catch{}}

function staffTypeChanged(){staffTable.disabled=staffType.value==='TAKEOUT'}
async function openStaffOrder(mode='DINE_IN'){
  if(!menuCache.length)await loadMenu();
  staffCart={};
  staffTable.innerHTML=Array.from({length:20},(_,i)=>`<option value="${i+1}">${i+1}号桌</option>`).join('');
  staffTable.value=selectedTable||1;
  staffType.value=mode==='TAKEOUT'?'TAKEOUT':'DINE_IN';
  staffTable.disabled=staffType.value==='TAKEOUT';
  staffNote.value='';
  renderStaffMenu();
  staffModal.style.display='flex'
}
function staffKey(id,vid='',sels=[]){return String(id)+'::'+String(vid||'')+'::'+JSON.stringify((sels||[]).map(s=>({groupId:String(s.groupId||''),optionIds:[...(s.optionIds||[])].map(String).sort()})).sort((a,b)=>a.groupId.localeCompare(b.groupId)))}
function staffItemLabel(x){
  let base=esc(x.name)+(x.variantName?' · '+esc(x.variantName):'');
  let opt=x.options?.length?'<div class="staffsel">'+x.options.map(o=>esc(o.groupName)+'：'+esc(o.name)+(o.price?' +₩'+won(o.price):'')).join(' / ')+'</div>':'';
  return base+opt
}
function renderStaffMenu(){
  let rows=[];
  menuCache.filter(x=>x.on!==false).forEach(x=>{
    let hasOpts=Array.isArray(x.optionGroups)&&x.optionGroups.length;
    let hasVars=Array.isArray(x.variants)&&x.variants.length;
    if(hasOpts){
      rows.push(`<div class="staffitem"><b>${esc(x.name)}</b><span class="muted">${esc(x.kr||'')}</span><br><button class="btn blue" style="margin-top:7px" onclick="openStaffCustomize('${esc(x.id)}')">选择规格/辣度/加料</button></div>`)
    }else{
      let vs=hasVars?x.variants:[null];
      vs.forEach(v=>{
        let key=staffKey(x.id,v&&v.id),q=staffCart[key]?.qty||0,price=Number(v?v.price:x.price||0),label=esc(x.name)+(v?' · '+esc(v.name):'');
        rows.push(`<div class="staffitem"><b>${label}</b><span class="muted">${esc(x.kr)}${v?' · '+esc(v.kr):''}</span><br>₩${won(price)}<div class="staffqty"><button onclick="staffChange('${esc(x.id)}','${esc(v?.id||'')}',-1)">−</button><b>${q}</b><button onclick="staffChange('${esc(x.id)}','${esc(v?.id||'')}',1)">＋</button></div></div>`)
      })
    }
  });
  let selected=Object.entries(staffCart).map(([k,x])=>`<div class="staffitem"><b>${staffItemLabel(x)}</b><br>₩${won(x.price)} × ${x.qty}<div class="staffqty"><button onclick="staffAdjustKey('${encodeURIComponent(k)}',-1)">−</button><b>${x.qty}</b><button onclick="staffAdjustKey('${encodeURIComponent(k)}',1)">＋</button></div></div>`).join('');
  staffMenu.innerHTML=(rows.join('')||'<p>没有可售菜品</p>')+(selected?`<h3 style="margin-top:15px">已选菜品</h3>${selected}`:'');
  staffCalc()
}
function staffChange(id,vid,delta){
  let m=menuCache.find(x=>String(x.id)===String(id));if(!m)return;
  let v=(m.variants||[]).find(x=>String(x.id)===String(vid));
  let key=staffKey(id,vid),q=Math.max(0,(staffCart[key]?.qty||0)+delta);
  if(q)staffCart[key]={id:m.id,variantId:v?String(v.id):'',optionSelections:[],options:[],qty:q,price:Number(v?v.price:m.price||0),name:m.name,variantName:v?.name||''};
  else delete staffCart[key];
  renderStaffMenu()
}
function staffAdjustKey(encoded,delta){
  let key=decodeURIComponent(encoded),x=staffCart[key];if(!x)return;
  x.qty=Math.max(0,(x.qty||0)+delta);if(!x.qty)delete staffCart[key];renderStaffMenu()
}
function openStaffCustomize(id){
  let x=menuCache.find(m=>String(m.id)===String(id));if(!x)return;
  staffCustomizing={id:String(x.id)};
  staffCustomTitle.textContent=(x.name||'')+' / '+(x.kr||'');
  let html='';
  if(Array.isArray(x.variants)&&x.variants.length){
    html+=`<div class="staffcustom"><h4>规格</h4>${x.variants.map((v,i)=>`<div class="staffopt"><label><input type="radio" name="staffVariant" value="${esc(v.id)}" ${i===0?'checked':''}> ${esc(v.name)} / ${esc(v.kr)}</label><b>₩${won(v.price)}</b></div>`).join('')}</div>`
  }
  (x.optionGroups||[]).forEach(g=>{
    let type=g.type==='multi'?'checkbox':'radio',name='staff_'+String(g.id).replace(/[^a-zA-Z0-9_-]/g,'_');
    html+=`<div class="staffcustom" data-group="${esc(g.id)}" data-required="${g.required?'1':'0'}"><h4>${esc(g.name)} / ${esc(g.kr)} ${g.required?'*':''}</h4>${(g.options||[]).map(o=>`<div class="staffopt"><label><input type="${type}" name="${esc(name)}" value="${esc(o.id)}"> ${esc(o.name)} / ${esc(o.kr)}</label><b>${Number(o.price||0)?'+₩'+won(o.price):'₩0'}</b></div>`).join('')}</div>`
  });
  staffCustomBody.innerHTML=html;staffCustomModal.style.display='flex'
}
function closeStaffCustom(){staffCustomModal.style.display='none';staffCustomizing=null}
function confirmStaffCustom(){
  if(!staffCustomizing)return;
  let x=menuCache.find(m=>String(m.id)===String(staffCustomizing.id));if(!x)return;
  let vr=staffCustomBody.querySelector('input[name="staffVariant"]:checked');
  let vid=vr?vr.value:'',selections=[];
  for(const g of staffCustomBody.querySelectorAll('.staffcustom[data-group]')){
    let ids=[...g.querySelectorAll('input:checked')].map(i=>i.value);
    if(g.dataset.required==='1'&&!ids.length){alert('请选择必选项');return}
    if(ids.length)selections.push({groupId:g.dataset.group,optionIds:ids})
  }
  let v=(x.variants||[]).find(a=>String(a.id)===String(vid)),chosen=[],extra=0;
  for(const sel of selections){
    let g=(x.optionGroups||[]).find(a=>String(a.id)===String(sel.groupId));if(!g)continue;
    for(const oid of sel.optionIds||[]){
      let o=(g.options||[]).find(a=>String(a.id)===String(oid));if(!o)continue;
      extra+=Number(o.price||0);chosen.push({groupId:g.id,groupName:g.name,groupKr:g.kr||'',optionId:o.id,name:o.name,kr:o.kr||'',price:Number(o.price||0)})
    }
  }
  let price=Number(v?v.price:x.price||0)+extra,key=staffKey(x.id,vid,selections),old=staffCart[key];
  staffCart[key]={id:x.id,variantId:vid,optionSelections:selections,options:chosen,qty:(old?.qty||0)+1,price,name:x.name,variantName:v?.name||''};
  closeStaffCustom();renderStaffMenu()
}
function staffCalc(){let total=Object.values(staffCart).reduce((a,x)=>a+x.price*x.qty,0);staffTotal.textContent=won(total)}

async function submitStaffOrder(){let items=Object.values(staffCart).map(x=>({id:x.id,variantId:x.variantId,optionSelections:x.optionSelections||[],qty:x.qty}));if(!items.length)return alert('请先选择菜品');staffSubmit.disabled=true;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:Number(staffTable.value||1),type:staffType.value,note:staffNote.value.trim(),items,source:'STAFF'})});staffSubmit.disabled=false;let d=await r.json();if(!r.ok)return alert(d.error||'下单失败');closeStaffOrder();await refreshOrders();alert('下单成功，已进入后厨打印队列')}
function closeStaffOrder(){staffModal.style.display='none'}
async function toggleSound(){soundOn=!soundOn;if(soundOn){await unlockAudio();await beep()}soundBtn.textContent=(soundOn?'🔊':'🔇')+' 新单声音：'+(soundOn?'开':'关')}
async function refreshAll(){await Promise.all([refreshOrders(),loadMenu()])}
async function refreshOrders(){let [r,sr,tr]=await Promise.all([fetch('/api/orders'),fetch('/api/stats'),fetch('/api/tables')]);if(r.status===401)return loginView();let os=await r.json(),s=await sr.json(),ts=await tr.json();let ids=new Set(os.filter(o=>o.status==='NEW').map(o=>o.id));if(knownReady&&[...ids].some(id=>!known.has(id)))beep();known=ids;knownReady=true;stats.innerHTML=`<div class="stat clickable" onclick="openTodayOrders()" title="点击查看今日订单明细">今日订单<b>${s.todayOrders||0}</b><span class="muted">点击查看明细</span></div><div class="stat">新订单<b>${s.newOrders||0}</b></div><div class="stat">制作中<b>${s.cookingOrders||0}</b></div><div class="stat">待结账<b>${s.doneOrders||0}</b></div><div class="stat">已结账<b>${s.paidOrders||0}</b></div><div class="stat">今日实收<b>₩${won(s.todaySales)}</b></div>`;tables.innerHTML=ts.map(t=>`<div onclick="chooseTable(${t.table})" class="tablebox ${t.status} ${selectedTable===t.table?'sel':''}"><b>${String(t.table).padStart(2,'0')}桌</b><br>${{FREE:'空闲',NEW:'新单',COOKING:'制作中',DONE:'待结账'}[t.status]}${t.activeOrders?`<br>₩${won(t.activeTotal)}`:''}</div>`).join('');let filter=o=>!selectedTable||Number(o.table)===selectedTable||o.type==='TAKEOUT';let active=os.filter(o=>['NEW','COOKING'].includes(o.status)&&filter(o)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));let done=os.filter(o=>o.status==='DONE'&&filter(o)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));orders.innerHTML=active.map(orderCard).join('')||'<p>当前没有正在制作的订单。</p>';doneOrders.innerHTML=done.map(orderCard).join('')||'<p>当前没有待结账订单。</p>'}
function koreaToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function orderStatusLabel(s){return {NEW:'新订单',COOKING:'制作中',DONE:'已完成/待结账',PAID:'已结账',CANCELLED:'已取消'}[s]||s}
async function openTodayOrders(){todayOrdersModal.style.display='flex';todayOrdersList.innerHTML='<p class="muted">正在加载...</p>';try{let r=await fetch('/api/orders/today',{cache:'no-store'});if(r.status===401){todayOrdersModal.style.display='none';return loginView()}let a=await r.json();if(!r.ok||!Array.isArray(a))throw new Error('load');a.sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));let total=a.filter(o=>o.status==='PAID').reduce((s,o)=>s+Number(o.total||0),0);todayOrdersList.innerHTML=`<div class="summaryline"><span>今日共 ${a.length} 单</span><span>已结账实收 ₩${won(total)}</span></div>`+(a.map(o=>`<div class="detailcard"><div class="detailhead"><span>${o.type==='TAKEOUT'?'🥡 外带':`🪑 ${o.table}号桌`}</span><span>₩${won(o.total)}</span></div><div class="muted">${new Date(o.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})} · <span class="statuspill">${orderStatusLabel(o.status)}</span></div>${(o.items||[]).map(x=>`<div class="item"><span>${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''}${Array.isArray(x.options)&&x.options.length?'<br><span class="muted">'+x.options.map(o=>esc(o.groupName)+'：'+esc(o.name)).join(' / ')+'</span>':''} × ${x.qty}</span><b>₩${won(Number(x.price||0)*Number(x.qty||0))}</b></div>`).join('')}${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}</div>`).join('')||'<p>今天还没有订单。</p>')}catch(e){todayOrdersList.innerHTML='<p>读取今日订单失败，请稍后重试。</p>'}}
function closeTodayOrders(){todayOrdersModal.style.display='none'}
async function loadSalesStats(){let date=(salesDate&&salesDate.value)||koreaToday();salesList.innerHTML='<p class="muted">正在统计...</p>';salesTotals.textContent='';try{let r=await fetch('/api/orders?date='+encodeURIComponent(date),{cache:'no-store'});if(r.status===401)return loginView();let a=await r.json();if(!r.ok||!Array.isArray(a))throw new Error('load');let paid=a.filter(o=>o.status==='PAID'),map=new Map(),sales=0;paid.forEach(o=>{sales+=Number(o.total||0);(o.items||[]).forEach(x=>{let key=String(x.id||x.name)+'::'+String(x.variantName||'');let prev=map.get(key)||{name:x.name||'未命名',variantName:x.variantName||'',qty:0,revenue:0};prev.qty+=Number(x.qty||0);prev.revenue+=Number(x.price||0)*Number(x.qty||0);map.set(key,prev)})});let rows=[...map.values()].sort((a,b)=>b.qty-a.qty||b.revenue-a.revenue);salesTotals.textContent=`${date} · 已结账 ${paid.length} 单 · 实收 ₩${won(sales)}`;salesList.innerHTML=rows.map((x,i)=>`<div class="salesitem"><div class="muted">销量第 ${i+1}</div><b>${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''}</b><div class="num">${x.qty} 份</div><div class="muted">销售额 ₩${won(x.revenue)}</div></div>`).join('')||'<p>这一天还没有已结账的菜品销量。</p>'}catch(e){salesList.innerHTML='<p>销量统计读取失败，请稍后重试。</p>'}}
function chooseTable(n){selectedTable=selectedTable===n?0:n;refreshOrders()}
function labelItem(x){let v=x.variantName?`（${esc(x.variantName)}）`:'';let op=Array.isArray(x.options)&&x.options.length?'<br><span class="muted">'+x.options.map(o=>esc(o.groupName)+'：'+esc(o.name)+(o.price?` +₩${won(o.price)}`:'')).join(' / ')+'</span>':'';return `${esc(x.name)}${v}${x.refillable?' <b>· 无限续面</b>':''}${op}`}
function orderCard(o){let st={NEW:'🔴 新订单',COOKING:'🟠 制作中',DONE:'🟢 已完成/待结账'}[o.status]||o.status,ps={PENDING:'待打印',CLAIMED:'发送中',PRINTED:'已打印',ERROR:'打印失败'}[o.printState||'PENDING'];return `<div class="order ${o.status}"><div class="head"><span>${o.type==='TAKEOUT'?'🥡 外带':`🪑 ${o.table}号桌`}${o.isRefill?' · 续面':''}</span><span>₩${won(o.total)}</span></div><div class="muted">${st} · ${new Date(o.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}<br>${esc(o.id)}</div>${o.items.map(x=>`<div class="item"><span>${labelItem(x)} × ${x.qty}</span><b>₩${won(x.price*x.qty)}</b></div>`).join('')}${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}<div class="print">🖨️ ${ps}${o.printCount?` · 已打印${o.printCount}次`:''}${o.printError?` · ${esc(o.printError)}`:''}</div><div class="actions">${o.status==='NEW'?`<button onclick="setStatus('${esc(o.id)}','COOKING')">制作中</button>`:''}${o.status==='COOKING'?`<button onclick="setStatus('${esc(o.id)}','DONE')">完成</button>`:''}${o.status==='DONE'?`<button style="background:#173c2e;color:white" onclick="setStatus('${esc(o.id)}','PAID')">💰 已结账</button>`:''}<button onclick="reprint('${esc(o.id)}')">🖨️ 补打</button><button onclick="setStatus('${esc(o.id)}','CANCELLED')">取消</button></div></div>`}
async function setStatus(id,status){let r=await fetch('/api/orders/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){let d=await r.json();return alert(d.error||'操作失败')}refreshOrders()}
async function reprint(id){let r=await fetch('/api/orders/'+encodeURIComponent(id)+'/reprint',{method:'POST'});if(!r.ok)return alert('补打请求失败');alert('已加入打印队列');refreshOrders()}
async function loadMenu(){let r=await fetch('/api/menu/all');if(r.status===401)return;menuCache=await r.json();menus.innerHTML=menuCache.map(x=>`<div class="menurow"><div>${x.image?`<img class="menuimg" src="${esc(x.image)}">`:`<div class="menuimg">${esc(x.emoji||'🍽️')}</div>`}</div><div><b>${esc(x.name)}</b> <span class="badge ${x.on?'':'off'}">${x.on?'在售':'已售罄'}</span><br><span class="muted">${esc(x.kr)} · ${esc(x.category||'未分类')}</span><br>${Array.isArray(x.variants)&&x.variants.length?x.variants.map(v=>`<span class="muted">${esc(v.name)}/${esc(v.kr)} ₩${won(v.price)}${v.refillable?' · 无限续面':''}</span>`).join('<br>'):`<b>₩${won(x.price)}</b>`}${Array.isArray(x.optionGroups)&&x.optionGroups.length?`<br><span class="muted">自定义选项：${x.optionGroups.length}组</span>`:''}</div><div class="menuactions"><button class="btn blue" onclick="editMenu('${esc(x.id)}')">编辑</button><button class="btn ${x.on?'red':'gold'}" onclick="toggleMenu('${esc(x.id)}',${!x.on})">${x.on?'售罄下架':'恢复上架'}</button>${x.image?`<button class="btn gray" onclick="removePhoto('${esc(x.id)}')">删照片</button>`:''}</div></div>`).join('')}
async function toggleMenu(id,on){await menuPost({id,on});loadMenu()}async function menuPost(body){let r=await fetch('/api/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let d=await r.json();alert(d.error||'保存失败')}return r}
function openMenu(){eId.value='';eName.value='';eKr.value='';ePrice.value='';eCat.value='';eEmoji.value='🍽️';eImage.value='';variants.innerHTML='';optionGroups.innerHTML='';modalTitle.textContent='＋ 新增菜品';menuModal.style.display='flex'}
function editMenu(id){let x=menuCache.find(m=>String(m.id)===String(id));if(!x)return;eId.value=x.id;eName.value=x.name||'';eKr.value=x.kr||'';ePrice.value=x.price||0;eCat.value=x.category||'';eEmoji.value=x.emoji||'🍽️';eImage.value='';variants.innerHTML='';optionGroups.innerHTML='';(x.variants||[]).forEach(v=>addVariant(v));(x.optionGroups||[]).forEach(g=>addOptionGroup(g));modalTitle.textContent='编辑菜品';menuModal.style.display='flex'}
function addVariant(v={}){let div=document.createElement('div');div.className='variant';div.innerHTML=`<input class="field vn" placeholder="大份" value="${esc(v.name||'')}"><input class="field vk" placeholder="대" value="${esc(v.kr||'')}"><input class="field vp" type="number" placeholder="价格" value="${Number(v.price||0)}"><label class="wide"><input class="vr" type="checkbox" ${v.refillable?'checked':''}> 无限续面 / 면 무한리필</label><button class="btn red" type="button" onclick="this.parentElement.remove()">删除</button>`;variants.appendChild(div)}
function collectVariants(){return [...variants.querySelectorAll('.variant')].map((d,i)=>({id:'v'+(i+1),name:d.querySelector('.vn').value.trim(),kr:d.querySelector('.vk').value.trim(),price:Number(d.querySelector('.vp').value||0),refillable:d.querySelector('.vr').checked})).filter(v=>v.name&&v.kr)}
function addOptionGroup(g={}){
  let box=document.createElement('div');box.className='optionGroup';
  box.innerHTML=`<div class="optionHead"><input class="field ogn" placeholder="选项组中文，例如：辣度" value="${esc(g.name||'')}"><input class="field ogk" placeholder="韩文，例如：맵기" value="${esc(g.kr||'')}"><select class="field ogt"><option value="single" ${(g.type||'single')==='single'?'selected':''}>单选</option><option value="multi" ${g.type==='multi'?'selected':''}>多选</option></select><label><input class="ogr" type="checkbox" ${g.required?'checked':''}> 必选</label><button class="btn red" type="button" onclick="this.closest('.optionGroup').remove()">删除组</button></div><div class="optionRows"></div><button class="btn gray" type="button" style="margin-top:7px" onclick="addOptionRow(this.closest('.optionGroup'))">＋ 添加选项</button>`;
  optionGroups.appendChild(box);
  (g.options||[]).forEach(o=>addOptionRow(box,o));
}
function addOptionRow(group,o={}){
  let row=document.createElement('div');row.className='optionRow';
  row.innerHTML=`<input class="field oin" placeholder="中文，例如：中辣" value="${esc(o.name||'')}"><input class="field oik" placeholder="韩文，例如：중간맛" value="${esc(o.kr||'')}"><input class="field oip" type="number" placeholder="加价" value="${Number(o.price||0)}"><button class="btn red" type="button" onclick="this.parentElement.remove()">删除</button>`;
  group.querySelector('.optionRows').appendChild(row);
}
function collectOptionGroups(){
  return [...optionGroups.querySelectorAll('.optionGroup')].map((g,gi)=>({
    id:'g'+(gi+1),
    name:g.querySelector('.ogn').value.trim(),
    kr:g.querySelector('.ogk').value.trim(),
    type:g.querySelector('.ogt').value==='multi'?'multi':'single',
    required:g.querySelector('.ogr').checked,
    options:[...g.querySelectorAll('.optionRow')].map((r,oi)=>({
      id:'o'+(oi+1),
      name:r.querySelector('.oin').value.trim(),
      kr:r.querySelector('.oik').value.trim(),
      price:Number(r.querySelector('.oip').value||0)
    })).filter(o=>o.name&&o.kr)
  })).filter(g=>g.name&&g.kr&&g.options.length)
}
async function saveMenu(){if(!eName.value.trim()||!eKr.value.trim()||!eCat.value.trim())return alert('请填写中文、韩文和分类');let fd=new FormData();if(eId.value)fd.append('id',eId.value);fd.append('name',eName.value.trim());fd.append('kr',eKr.value.trim());fd.append('price',ePrice.value||0);fd.append('category',eCat.value.trim());fd.append('emoji',eEmoji.value.trim()||'🍽️');fd.append('variants',JSON.stringify(collectVariants()));fd.append('optionGroups',JSON.stringify(collectOptionGroups()));if(eImage.files[0])fd.append('image',eImage.files[0]);saveMenuBtn.disabled=true;let r=await fetch('/api/menu',{method:'POST',body:fd});saveMenuBtn.disabled=false;let d=await r.json();if(!r.ok)return alert(d.error||'保存失败');closeMenu();loadMenu()}
async function removePhoto(id){if(!confirm('确定删除照片？'))return;await fetch('/api/menu/'+encodeURIComponent(id)+'/image',{method:'DELETE'});loadMenu()}function closeMenu(){menuModal.style.display='none'}async function logout(){await fetch('/api/logout',{method:'POST'});loginView()}async function initAdmin(){try{let r=await fetch('/api/orders',{cache:'no-store'});if(r.status===401)return loginView();if(!r.ok)return loginView();await showApp()}catch(e){loginView()}}initAdmin();
</script></body></html>
