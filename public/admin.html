<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四季三餐｜后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#222}header{background:#18251e;color:#fff;padding:20px}.brand{font-size:23px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:15px}.login{max-width:420px;margin:70px auto;background:#fff;padding:25px;border-radius:16px}.login input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:12px 0}.btn{border:0;border-radius:9px;padding:10px 14px;background:#18251e;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;padding:15px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:5px}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.order{background:#fff;border-radius:15px;padding:15px}.new{border-left:5px solid #b33a2f}.head{display:flex;justify-content:space-between;font-weight:800}.item{display:flex;justify-content:space-between;padding:5px 0}.status{display:flex;gap:6px;margin-top:10px}.status button{flex:1;padding:9px;border:0;border-radius:8px}.qr,.menu{background:#fff;margin-top:15px;padding:15px;border-radius:15px}.qrs img{width:150px}.qrs>div{display:inline-block;text-align:center;margin:8px}.menuRow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.menuRow input{width:90px;padding:8px}.menuRow .name{flex:1}.hidden{display:none}@media(max-width:600px){.stats{grid-template-columns:1fr}.qrs img{width:110px}}
</style></head><body><header><div class="brand">四季三餐 · 사계삼찬</div><div>老板 / 后厨管理后台</div></header><div id="app" class="wrap"></div>
<script>
const won=n=>Number(n).toLocaleString("ko-KR");let app=document.getElementById("app");
async function login(){let p=document.getElementById("pw").value,r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});if(r.ok)dashboard();else alert("密码错误")}
async function dashboard(){app.innerHTML=`<div class="toolbar"><button class="btn" onclick="load()">🔄 刷新</button><button class="btn" onclick="logout()">退出</button></div><div id="stats" class="stats"></div><div id="orders" class="orders"></div><div class="menu"><h3>菜单管理</h3><div id="menu"></div></div><div class="qr"><h3>30张桌子二维码</h3><div class="qrs" id="qrs"></div></div>`;for(let i=1;i<=30;i++)qrs.innerHTML+=`<div><img src="/api/qr?table=${i}"><br>${i}号桌</div>`;load();loadMenu();setInterval(load,3000)}
async function load(){let r=await fetch("/api/orders");if(r.status===401)return location.reload();let os=await r.json();os.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));orders.innerHTML=os.map(o=>`<div class="order ${o.status==="NEW"?"new":""}"><div class="head"><span>${o.type==="TAKEOUT"?"🥡":"🪑"} ${o.table}号桌</span><span>₩${won(o.total)}</span></div><small>${new Date(o.createdAt).toLocaleString()}</small><div>${o.items.map(x=>`<div class="item"><span>${x.name}</span><b>×${x.qty}</b></div>`).join("")}</div>${o.note?`<div>📝 ${o.note}</div>`:""}<div class="status"><button onclick="status('${o.id}','NEW')">新订单</button><button onclick="status('${o.id}','COOKING')">制作中</button><button onclick="status('${o.id}','DONE')">完成</button><button onclick="delOrder('${o.id}')">删除</button></div></div>`).join("")||"<p>暂无订单</p>";let s=await fetch("/api/stats").then(r=>r.json());stats.innerHTML=`<div class="stat">今日订单<b>${s.todayOrders}</b></div><div class="stat">今日营业额<b>₩${won(s.todaySales)}</b></div><div class="stat">完成订单营业额<b>₩${won(s.doneSales)}</b></div>`}
async function status(id,s){await fetch("/api/orders/"+id+"/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});load()}async function delOrder(id){if(confirm("确定删除这笔订单？")){await fetch("/api/orders/"+id,{method:"DELETE"});load()}}
async function loadMenu(){let ms=await fetch("/api/menu/all").then(r=>r.json());menu.innerHTML=ms.map(x=>`<div class="menuRow"><span class="name">${x.emoji} ${x.name} / ${x.kr}</span><input id="p-${x.id}" value="${x.price}" type="number"><label><input id="o-${x.id}" type="checkbox" ${x.on?"checked":""}> 上架</label><button class="btn" onclick="saveMenu('${x.id}')">保存</button></div>`).join("")}
async function saveMenu(id){await fetch("/api/menu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,price:document.getElementById("p-"+id).value,on:document.getElementById("o-"+id).checked})});alert("已保存")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
app.innerHTML=`<div class="login"><h2>老板后台</h2><p>请输入管理员密码</p><input id="pw" type="password" placeholder="管理员密码"><button class="btn" style="width:100%" onclick="login()">进入后台</button></div>`;
</script></body></html>
