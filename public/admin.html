<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四季三餐｜后台</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f3ef;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  color:#222;
}

header{
  background:#18251e;
  color:#fff;
  padding:20px;
}

.brand{
  font-size:23px;
  font-weight:800;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.login{
  max-width:420px;
  margin:70px auto;
  background:#fff;
  padding:25px;
  border-radius:16px;
}

.login input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  margin:12px 0;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:#18251e;
  color:#fff;
  cursor:pointer;
}

.btn.gray{
  background:#777;
}

.btn.red{
  background:#a83226;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:#fff;
  padding:15px;
  border-radius:14px;
}

.stat b{
  display:block;
  font-size:21px;
  margin-top:5px;
}

.orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:12px;
}

.order{
  background:#fff;
  border-radius:15px;
  padding:15px;
  box-shadow:0 2px 8px #00000008;
}

.new{
  border-left:5px solid #b33a2f;
}

.head{
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.item .calc{
  color:#555;
  font-size:14px;
}

.status{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.status button{
  flex:1;
  min-width:70px;
  padding:9px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.detailBtn{
  margin-top:12px;
  width:100%;
  background:#f0eee9;
  border:0;
  border-radius:9px;
  padding:10px;
  cursor:pointer;
}

.detail{
  display:none;
  background:#faf9f7;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.detail.open{
  display:block;
}

.totalLine{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:18px;
  border-top:1px solid #ddd;
  margin-top:10px;
  padding-top:10px;
}

.menu,
.qr{
  background:#fff;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.qrs img{
  width:150px;
}

.qrs>div{
  display:inline-block;
  text-align:center;
  margin:8px;
}

.menuRow{
  display:flex;
  gap:8px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
  flex-wrap:wrap;
}

.menuRow input[type=number]{
  width:100px;
  padding:8px;
}

.menuRow .name{
  flex:1;
  min-width:180px;
}

.menuImg{
  width:80px;
  height:60px;
  object-fit:cover;
  border-radius:9px;
  background:#eee;
}

.menuActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.hidden{
  display:none !important;
}

.photoBox{
  background:#faf9f7;
  border:1px dashed #ccc;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
}

.photoBox img{
  width:110px;
  height:80px;
  object-fit:cover;
  border-radius:9px;
  display:block;
  margin-bottom:8px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalCard{
  background:#fff;
  border-radius:16px;
  padding:22px;
  width:min(460px,100%);
  box-shadow:0 10px 40px #0005;
  max-height:90vh;
  overflow:auto;
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.closeBtn{
  border:0;
  background:#eee;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.modalCard input:not([type=file]){
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:9px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:12px;
  margin:8px 0;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .qrs img{
    width:110px;
  }

  .orders{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<header>
  <div class="brand">四季三餐 · 사계삼찬</div>
  <div>老板 / 后厨管理后台</div>
</header>

<div id="app" class="wrap"></div>

<script>

const won = n =>
  Number(n || 0).toLocaleString("ko-KR");

const app =
  document.getElementById("app");

let timer = null;


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(str){

  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   登录
===================================================== */

async function login(){

  const p =
    document.getElementById("pw").value;

  if(!p){
    alert("请输入管理员密码");
    return;
  }

  try{

    const r =
      await fetch("/api/login",{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          password:p
        })
      });

    if(r.ok){

      await dashboard();

    }else{

      alert("密码错误");

    }

  }catch(error){

    console.error(error);

    alert("无法连接服务器");

  }

}


/* =====================================================
   后台
===================================================== */

async function dashboard(){

  app.innerHTML = `

    <div class="toolbar">

      <button class="btn"
        onclick="load()">
        🔄 刷新订单
      </button>

      <button class="btn"
        onclick="loadMenu()">
        🍜 刷新菜单
      </button>

      <button class="btn"
        onclick="showAddMenu()">
        ＋ 新增菜单
      </button>

      <button class="btn"
        onclick="logout()">
        退出
      </button>

    </div>

    <div id="stats"
         class="stats"></div>

    <h3>订单</h3>

    <div id="orders"
         class="orders"></div>

    <div class="menu">

      <h3>
        菜单管理
      </h3>

      <div id="menu"></div>

    </div>

    <div class="qr">

      <h3>
        30张桌子二维码
      </h3>

      <div class="qrs"
           id="qrs"></div>

    </div>

    <!-- =============================
         新增菜单弹窗
    ============================== -->

    <div id="addMenuBox"
         class="modal hidden">

      <div class="modalCard"
           onclick="event.stopPropagation()">

        <div class="modalHeader">

          <h2 style="margin:0">
            新增菜单
          </h2>

          <button
            class="closeBtn"
            onclick="hideAddMenu()">
            ×
          </button>

        </div>

        <label>中文菜名</label>

        <input
          id="newName"
          placeholder="例如：鲜肉馄饨">

        <label>韩文菜名</label>

        <input
          id="newKr"
          placeholder="例如：고기 완탕">

        <label>价格（韩元）</label>

        <input
          id="newPrice"
          type="number"
          min="0"
          placeholder="例如：9000">

        <label>分类</label>

        <input
          id="newCategory"
          placeholder="例如：馄饨">

        <label>菜品照片</label>

        <div class="photoBox">

          <input
            id="newImage"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            onchange="previewNewImage()">

          <img
            id="newPreview"
            class="preview hidden">

          <small>
            支持 JPG / PNG / WEBP / GIF
          </small>

        </div>

        <label>
          图标 Emoji
        </label>

        <input
          id="newEmoji"
          placeholder="🥟">

        <div style="
          display:flex;
          gap:8px;
          justify-content:flex-end;
          margin-top:15px;
        ">

          <button
            class="btn gray"
            onclick="hideAddMenu()">
            取消
          </button>

          <button
            id="saveMenuBtn"
            class="btn"
            onclick="addMenu()">
            保存并上架
          </button>

        </div>

      </div>

    </div>
  `;


  /* 生成二维码 */

  const qrs =
    document.getElementById("qrs");

  for(let i=1;i<=30;i++){

    qrs.innerHTML += `

      <div>

        <img
          src="/api/qr?table=${i}"
          alt="${i}号桌二维码">

        <br>

        ${i}号桌

      </div>

    `;

  }


  await load();
  await loadMenu();


  if(timer){
    clearInterval(timer);
  }

  timer =
    setInterval(load,3000);

}


/* =====================================================
   订单
===================================================== */

async function load(){

  try{

    const r =
      await fetch("/api/orders");

    if(r.status === 401){

      location.reload();
      return;

    }

    const os =
      await r.json();

    os.sort(
      (a,b) =>
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );


    document.getElementById("orders")
      .innerHTML =

      os.map(o => {

        const statusText = {
          NEW:"新订单",
          COOKING:"制作中",
          DONE:"完成"
        }[o.status] || o.status;


        return `

          <div class="order ${
            o.status==="NEW"
              ? "new"
              : ""
          }">

            <div class="head">

              <span>
                ${
                  o.type==="TAKEOUT"
                    ? "🥡"
                    : "🪑"
                }
                ${o.table}号桌
              </span>

              <span>
                ₩${won(o.total)}
              </span>

            </div>

            <small>

              订单号：
              ${escapeHtml(o.id)}

              <br>

              ${new Date(
                o.createdAt
              ).toLocaleString("ko-KR")}

              ·

              ${statusText}

            </small>

            <div style="margin-top:8px">

              ${o.items.map(x => `

                <div class="item">

                  <span>
                    ${escapeHtml(x.name)}
                    × ${x.qty}
                  </span>

                  <b>
                    ₩${won(
                      x.price*x.qty
                    )}
                  </b>

                </div>

              `).join("")}

            </div>


            <button
              class="detailBtn"
              onclick="toggleDetail('${escapeHtml(o.id)}')">

              查看订单详情 ▼

            </button>


            <div
              id="detail-${escapeHtml(o.id)}"
              class="detail">

              <h4 style="margin-top:0">
                订单明细
              </h4>

              ${o.items.map(x => `

                <div style="
                  padding:7px 0;
                  border-bottom:1px solid #eee
                ">

                  <div style="
                    display:flex;
                    justify-content:space-between
                  ">

                    <strong>
                      ${escapeHtml(x.name)}
                    </strong>

                    <strong>
                      ₩${won(
                        x.price*x.qty
                      )}
                    </strong>

                  </div>

                  <div class="calc">

                    ₩${won(x.price)}
                    × ${x.qty}
                    =
                    ₩${won(
                      x.price*x.qty
                    )}

                  </div>

                </div>

              `).join("")}


              ${
                o.note
                ?
                `
                <div style="margin-top:10px">

                  📝
                  <b>备注：</b>
                  ${escapeHtml(o.note)}

                </div>
                `
                :
                ""
              }


              <div class="totalLine">

                <span>
                  订单合计
                </span>

                <span>
                  ₩${won(o.total)}
                </span>

              </div>

            </div>


            <div class="status">

              <button
                onclick="status('${escapeHtml(o.id)}','NEW')">
                新订单
              </button>

              <button
                onclick="status('${escapeHtml(o.id)}','COOKING')">
                制作中
              </button>

              <button
                onclick="status('${escapeHtml(o.id)}','DONE')">
                完成
              </button>

              <button
                onclick="delOrder('${escapeHtml(o.id)}')">
                删除
              </button>

            </div>

          </div>

        `;

      }).join("") ||

      "<p>暂无订单</p>";


    const sr =
      await fetch("/api/stats");

    if(sr.status === 401){
      location.reload();
      return;
    }

    const s =
      await sr.json();


    document.getElementById("stats")
      .innerHTML = `

        <div class="stat">
          今日订单
          <b>${s.todayOrders || 0}</b>
        </div>

        <div class="stat">
          待处理
          <b>${s.newOrders || 0}</b>
        </div>

        <div class="stat">
          制作中
          <b>${s.cookingOrders || 0}</b>
        </div>

        <div class="stat">
          已完成
          <b>${s.doneOrders || 0}</b>
        </div>

        <div class="stat">
          今日营业额
          <b>
            ₩${won(s.todaySales)}
          </b>
        </div>

      `;

  }catch(error){

    console.error(
      "订单刷新失败:",
      error
    );

  }

}


/* =====================================================
   订单详情
===================================================== */

function toggleDetail(id){

  const el =
    document.getElementById(
      "detail-"+id
    );

  if(el){
    el.classList.toggle("open");
  }

}


/* =====================================================
   修改订单状态
===================================================== */

async function status(id,s){

  try{

    const r =
      await fetch(
        "/api/orders/"+encodeURIComponent(id)+"/status",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            status:s
          })
        }
      );

    if(!r.ok){

      const d =
        await r.json();

      alert(
        d.error ||
        "状态修改失败"
      );

      return;

    }

    await load();

  }catch(error){

    console.error(error);

    alert("服务器连接失败");

  }

}


/* =====================================================
   删除订单
===================================================== */

async function delOrder(id){

  if(!confirm(
    "确定删除这笔订单？"
  )){
    return;
  }

  try{

    const r =
      await fetch(
        "/api/orders/"+encodeURIComponent(id),
        {
          method:"DELETE"
        }
      );

    if(!r.ok){

      const d =
        await r.json();

      alert(
        d.error ||
        "删除失败"
      );

      return;

    }

    await load();

  }catch(error){

    console.error(error);

    alert("服务器连接失败");

  }

}


/* =====================================================
   菜单
===================================================== */

async function loadMenu(){

  try{

    const r =
      await fetch("/api/menu/all");

    if(r.status === 401){

      location.reload();
      return;

    }

    const ms =
      await r.json();


    document.getElementById("menu")
      .innerHTML =

      ms.map(x => `

        <div class="menuRow">

          ${
            x.image

            ?

            `
            <img
              class="menuImg"
              src="${escapeHtml(x.image)}"
              alt="">
            `

            :

            `
            <div
              class="menuImg"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:28px
              ">

              ${escapeHtml(
                x.emoji || "🍽️"
              )}

            </div>
            `
          }


          <span class="name">

            <strong>
              ${escapeHtml(x.name)}
            </strong>

            <br>

            <small>

              ${escapeHtml(x.kr)}
              ·
              ${escapeHtml(
                x.category || ""
              )}

            </small>

          </span>


          <div class="menuActions">

            <input
              id="p-${escapeHtml(x.id)}"
              value="${Number(x.price)||0}"
              type="number"
              min="0">


            <label>

              <input
                id="o-${escapeHtml(x.id)}"
                type="checkbox"
                ${
                  x.on
                    ? "checked"
                    : ""
                }>

              上架

            </label>


            <button
              class="btn"
              onclick="saveMenu('${escapeHtml(x.id)}')">

              保存

            </button>


            <button
              class="btn gray"
              onclick="changePhoto('${escapeHtml(x.id)}')">

              更换照片

            </button>

          </div>


          <input
            id="photo-${escapeHtml(x.id)}"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            style="display:none"
            onchange="uploadExistingPhoto('${escapeHtml(x.id)}')">

        </div>

      `).join("");

  }catch(error){

    console.error(
      "菜单加载失败:",
      error
    );

  }

}


/* =====================================================
   保存菜单价格 / 上架状态
===================================================== */

async function saveMenu(id){

  const price =
    document.getElementById(
      "p-"+id
    ).value;

  const on =
    document.getElementById(
      "o-"+id
    ).checked;


  try{

    const r =
      await fetch("/api/menu",{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          id,
          price,
          on
        })
      });


    const d =
      await r.json();


    if(!r.ok){

      alert(
        d.error ||
        "保存失败"
      );

      return;

    }


    await loadMenu();

  }catch(error){

    console.error(error);

    alert("服务器连接失败");

  }

}


/* =====================================================
   更换照片
===================================================== */

function changePhoto(id){

  const input =
    document.getElementById(
      "photo-"+id
    );

  if(input){
    input.click();
  }

}


async function uploadExistingPhoto(id){

  const input =
    document.getElementById(
      "photo-"+id
    );

  if(
    !input ||
    !input.files ||
    !input.files[0]
  ){
    return;
  }


  const fd =
    new FormData();

  fd.append(
    "image",
    input.files[0]
  );


  try{

    const r =
      await fetch(
        "/api/menu/"+encodeURIComponent(id)+"/image",
        {
          method:"POST",
          body:fd
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      alert(
        d.error ||
        "照片上传失败"
      );

      return;

    }


    await loadMenu();

    alert("照片已更新");

  }catch(error){

    console.error(error);

    alert("照片上传失败");

  }

}


/* =====================================================
   打开新增菜单
===================================================== */

function showAddMenu(){

  const box =
    document.getElementById(
      "addMenuBox"
    );

  if(!box){
    return;
  }

  box.classList.remove("hidden");

  setTimeout(() => {

    const name =
      document.getElementById(
        "newName"
      );

    if(name){
      name.focus();
    }

  },50);

}


/* =====================================================
   关闭新增菜单
===================================================== */

function hideAddMenu(){

  const box =
    document.getElementById(
      "addMenuBox"
    );

  if(!box){
    return;
  }

  box.classList.add("hidden");

  resetAddMenuForm();

}


/* =====================================================
   清空新增菜单表单
===================================================== */

function resetAddMenuForm(){

  const ids = [
    "newName",
    "newKr",
    "newPrice",
    "newCategory",
    "newEmoji"
  ];


  ids.forEach(id => {

    const el =
      document.getElementById(id);

    if(el){
      el.value="";
    }

  });


  const image =
    document.getElementById(
      "newImage"
    );

  if(image){
    image.value="";
  }


  const preview =
    document.getElementById(
      "newPreview"
    );

  if(preview){

    preview.src="";

    preview.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   新增菜单照片预览
===================================================== */

function previewNewImage(){

  const input =
    document.getElementById(
      "newImage"
    );

  const img =
    document.getElementById(
      "newPreview"
    );


  if(
    !input ||
    !input.files ||
    !input.files[0]
  ){

    img.classList.add(
      "hidden"
    );

    img.src="";

    return;

  }


  const file =
    input.files[0];


  if(!file.type.startsWith("image/")){

    alert("请选择图片文件");

    input.value="";

    img.classList.add(
      "hidden"
    );

    return;

  }


  img.src =
    URL.createObjectURL(file);

  img.classList.remove(
    "hidden"
  );

}


/* =====================================================
   新增菜单
===================================================== */

async function addMenu(){

  const name =
    document.getElementById(
      "newName"
    ).value.trim();

  const kr =
    document.getElementById(
      "newKr"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "newPrice"
      ).value
    );

  const category =
    document.getElementById(
      "newCategory"
    ).value.trim();

  const emoji =
    document.getElementById(
      "newEmoji"
    ).value.trim() ||
    "🍽️";

  const imageInput =
    document.getElementById(
      "newImage"
    );

  const image =
    imageInput &&
    imageInput.files
      ? imageInput.files[0]
      : null;


  if(
    !name ||
    !kr ||
    !category ||
    !Number.isFinite(price) ||
    price < 0
  ){

    alert(
      "请把中文名、韩文名、价格和分类填写完整"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveMenuBtn"
    );


  if(button){

    button.disabled=true;

    button.textContent=
      "正在保存...";

  }


  try{

    /*
     * 这里使用 FormData。
     *
     * 注意：
     * 不要手动设置 Content-Type。
     * 浏览器会自动生成 multipart boundary。
     */

    const fd =
      new FormData();

    fd.append(
      "name",
      name
    );

    fd.append(
      "kr",
      kr
    );

    fd.append(
      "price",
      String(price)
    );

    fd.append(
      "category",
      category
    );

    fd.append(
      "emoji",
      emoji
    );

    fd.append(
      "on",
      "true"
    );


    if(image){

      fd.append(
        "image",
        image
      );

    }


    const r =
      await fetch(
        "/api/menu",
        {
          method:"POST",
          body:fd
        }
      );


    const text =
      await r.text();


    let d={};

    try{
      d=JSON.parse(text);
    }catch{
      d={
        error:text
      };
    }


    if(!r.ok){

      alert(
        d.error ||
        "新增菜单失败"
      );

      return;

    }


    /*
     * 关键修复：
     *
     * 服务器保存成功后，
     * 先关闭弹窗，
     * 再清空表单，
     * 最后刷新菜单。
     */

    hideAddMenu();

    await loadMenu();

    alert(
      "菜单新增成功！"
    );


  }catch(error){

    console.error(
      "新增菜单失败:",
      error
    );

    alert(
      "新增菜单失败，请检查服务器"
    );

  }finally{

    if(button){

      button.disabled=false;

      button.textContent=
        "保存并上架";

    }

  }

}

async function logout(){

  try{

    await fetch(
      "/api/logout",
      {
        method:"POST"
      }
    );

  }catch(error){

    console.error(error);

  }

  location.reload();

}


/* =====================================================
   点击黑色背景关闭弹窗
===================================================== */

document.addEventListener(
  "click",
  function(event){

    const box =
      document.getElementById(
        "addMenuBox"
      );

    if(
      box &&
      event.target === box
    ){

      hideAddMenu();

    }

  }
);


/* =====================================================
   ESC 关闭弹窗
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      const box =
        document.getElementById(
          "addMenuBox"
        );

      if(
        box &&
        !box.classList.contains(
          "hidden"
        )
      ){

        hideAddMenu();

      }

    }

  }
);
