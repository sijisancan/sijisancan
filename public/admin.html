<body>

<header>
  <div class="brand">四季三餐 · 사계삼찬</div>
  <div class="sub">老板 / 后厨 / 收银管理后台 · v4.0</div>
</header>

<div id="app" class="wrap"></div>

<script>

const won=n=>Number(n||0).toLocaleString("ko-KR");

const app=document.getElementById("app");

let refreshTimer=null;
let firstLoad=true;


/* =========================
   通用请求
========================= */

async function api(url,options={}){
  const r=await fetch(url,options);

  if(r.status===401){
    location.reload();
    throw new Error("unauthorized");
  }

  return r;
}


/* =========================
   登录
========================= */

async function login(){

  const pw=document.getElementById("pw").value;

  if(!pw){
    alert("请输入管理员密码");
    return;
  }

  try{

    const r=await fetch("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        password:pw
      })
    });

    if(r.ok){
      dashboard();
    }else{
      alert("密码错误");
    }

  }catch(e){
    alert("无法连接服务器");
  }
}


/* =========================
   后台首页
========================= */

function dashboard(){

  app.innerHTML=`

    <div class="toolbar">

      <button class="btn" onclick="loadAll()">
        🔄 刷新
      </button>

      <button class="btn" onclick="loadOrders()">
        📋 订单
      </button>

      <button class="btn" onclick="loadMenu()">
        🍜 菜单
      </button>

      <button class="btn" onclick="scrollToQR()">
        📱 二维码
      </button>

      <button class="btn gray" onclick="logout()">
        退出
      </button>

    </div>

    <div class="help">
      💡 <b>订单流程：</b>
      新订单 → 制作中 → 完成 → POS / 手动结账 → 已结束。
      <br>
      💳 付款状态与厨房制作状态分开记录。
    </div>

    <div id="stats" class="stats"></div>

    <div class="section">

      <div class="sectionTitle">

        <h3>📋 实时订单</h3>

        <span id="lastUpdate"
          style="font-size:12px;color:#888">
        </span>

      </div>

      <div id="orders" class="orders"></div>

    </div>

    <div class="menu">

      <div class="sectionTitle">

        <h3>🍜 菜单管理</h3>

        <button class="btn"
          onclick="showAddMenu()">
          ＋ 新增菜品
        </button>

      </div>

      <div id="addMenuBox"
        class="addBox"
        style="display:none">

        <h4>新增菜品</h4>

        <input id="newName"
          placeholder="菜品名称">

        <input id="newKr"
          placeholder="韩文名称">

        <input id="newPrice"
          type="number"
          placeholder="价格，例如 11000">

        <input id="newEmoji"
          placeholder="Emoji，例如 🍜"
          value="🍽️">

        <label style="display:block;margin:10px 0">

          <input id="newOn"
            type="checkbox"
            checked
            style="width:auto">

          立即上架

        </label>

        <button class="btn green"
          onclick="addMenu()">
          保存菜品
        </button>

        <button class="btn gray"
          onclick="hideAddMenu()">
          取消
        </button>

      </div>

      <div id="menu"></div>

    </div>

    <div class="qr" id="qrSection">

      <div class="sectionTitle">

        <h3>📱 30张桌子二维码</h3>

        <button class="btn"
          onclick="window.print()">
          🖨️ 打印二维码
        </button>

      </div>

      <p style="font-size:13px;color:#777">
        顾客扫描对应桌号二维码后，会自动进入该桌点餐页面。
      </p>

      <div class="qrs" id="qrs"></div>

    </div>

  `;

  renderQR();

  loadAll();

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  refreshTimer=setInterval(loadOrders,3000);
}


/* =========================
   一次加载全部
========================= */

async function loadAll(){

  await Promise.all([
    loadOrders(),
    loadMenu()
  ]);

  firstLoad=false;
}


/* =========================
   订单
========================= */

async function loadOrders(){

  try{

    const r=await api("/api/orders");

    const os=await r.json();

    os.sort(
      (a,b)=>
        new Date(b.createdAt)-
        new Date(a.createdAt)
    );

    renderOrders(os);

    const s=await api("/api/stats")
      .then(r=>r.json());

    renderStats(s);

    document.getElementById("lastUpdate").textContent=
      "最后更新："+new Date().toLocaleTimeString("ko-KR");

  }catch(e){

    if(firstLoad){
      document.getElementById("orders").innerHTML=
        '<div class="empty">订单加载失败</div>';
    }

  }
}


/* =========================
   状态文字
========================= */

function statusText(s){

  return {
    NEW:"新订单",
    COOKING:"制作中",
    DONE:"已完成",
    CANCELLED:"已取消"
  }[s]||s;

}

function paymentText(s){

  return {
    UNPAID:"未付款",
    PAID:"已付款",
    REFUNDED:"已退款"
  }[s]||"未付款";

}


/* =========================
   订单卡片
========================= */

function renderOrders(os){

  const box=document.getElementById("orders");

  if(!os.length){

    box.innerHTML=
      '<div class="empty">📭 暂无订单</div>';

    return;
  }

  box.innerHTML=os.map(o=>{

    const status=o.status||"NEW";
    const payment=o.paymentStatus||"UNPAID";

    const orderClass=
      status==="NEW"?"new":
      status==="COOKING"?"cooking":
      status==="DONE"?"done":
      "cancelled";

    const typeText=
      o.type==="TAKEOUT"
      ?"🥡 打包"
      :"🪑 堂食";

    const paidClass=
      payment==="PAID"?"paid":
      payment==="REFUNDED"?"refunded":
      "unpaid";

    const closed=
      o.closedAt
      ?`<span class="badge paid">🔒 已结束</span>`
      :"";

    const payInfo=
      payment==="PAID"
      ?`
        <div style="font-size:12px;color:#247a45;margin-top:6px">
          💳 ${o.paymentMethod||"POS"}
          ${o.paymentTransactionId
            ?" · "+escapeHtml(o.paymentTransactionId)
            :""}
          <br>
          ${o.paidAt
            ?"付款："+new Date(o.paidAt).toLocaleString("ko-KR")
            :""}
        </div>
      `
      :"";

    return `

      <div class="order ${orderClass}">

        <div class="head">

          <span>
            ${typeText}
            ${o.table}号桌
          </span>

          <span>
            ₩${won(o.total)}
          </span>

        </div>

        <div class="orderId">
          订单号：${escapeHtml(o.id)}
        </div>

        <small style="color:#777">
          ${new Date(o.createdAt)
            .toLocaleString("ko-KR")}
        </small>

        <div class="badges">

          <span class="badge ${
            status==="NEW"?"new":
            status==="COOKING"?"cooking":
            status==="DONE"?"done":
            "cancelled"
          }">
            ${statusText(status)}
          </span>

          <span class="badge ${paidClass}">
            ${paymentText(payment)}
          </span>

          ${closed}

        </div>

        <div style="margin-top:10px">

          ${(o.items||[]).map(x=>`

            <div class="item">

              <span>
                ${x.emoji||"🍽️"}
                ${escapeHtml(x.name)}
              </span>

              <b>
                ×${x.qty}
                <span style="font-weight:400;color:#777">
                  ₩${won(x.price*x.qty)}
                </span>
              </b>

            </div>

          `).join("")}

        </div>

        ${o.note
          ?`
            <div class="note">
              📝 ${escapeHtml(o.note)}
            </div>
          `
          :""
        }

        ${payInfo}

        <div class="actions">

          <button
            style="background:#ffe3df"
            onclick="changeStatus('${o.id}','NEW')">
            🆕 新订单
          </button>

          <button
            style="background:#fff0d6"
            onclick="changeStatus('${o.id}','COOKING')">
            👨‍🍳 制作中
          </button>

          <button
            style="background:#dff4e6"
            onclick="changeStatus('${o.id}','DONE')">
            ✅ 完成
          </button>

          ${
            payment!=="PAID"
            ?`
              <button
                style="background:#dff4e6"
                onclick="manualPay('${o.id}')">
                💰 手动结账
              </button>
            `
            :`
              <button
                style="background:#eee0f8"
                onclick="refundOrder('${o.id}')">
                ↩️ 退款
              </button>
            `
          }

          ${
            payment!=="PAID" &&
            status!=="CANCELLED"
            ?`
              <button
                style="background:#fff4e5"
                onclick="cancelOrder('${o.id}')">
                🚫 取消订单
              </button>
            `
            :""
          }

          <button
            style="background:#eee;color:#555"
            onclick="delOrder('${o.id}')">
            🗑️ 删除
          </button>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================
   HTML安全
========================= */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   修改制作状态
========================= */

async function changeStatus(id,status){

  try{

    const r=await api(
      "/api/orders/"+encodeURIComponent(id)+"/status",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          status
        })
      }
    );

    if(!r.ok){

      const d=await r.json().catch(()=>({}));

      alert(d.error||"修改失败");

      return;
    }

    loadOrders();

  }catch(e){

    alert("操作失败");

  }

}


/* =========================
   手动结账
========================= */

async function manualPay(id){

  const method=
    prompt(
      "请输入付款方式：\nCARD = 刷卡\nCASH = 现金\nPOS = POS\nOTHER = 其他",
      "POS"
    );

  if(method===null)return;

  const paymentMethod=
    method.trim()||"MANUAL";

  const transactionId=
    prompt(
      "如果有POS交易号，可以输入；没有直接取消即可。",
      ""
    );

  try{

    const r=await api(
      "/api/orders/"+encodeURIComponent(id)+"/pay",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          paymentMethod,
          transactionId:
            transactionId?
            transactionId.trim():
            ""
        })
      }
    );

    const d=await r.json();

    if(!r.ok){

      alert(d.error||"结账失败");

      return;
    }

    alert(
      "✅ 结账成功\n\n"+
      "订单："+id+
      "\n金额：₩"+won(d.order.total)+
      "\n付款方式："+d.order.paymentMethod+
      "\n订单已结束"
    );

    loadOrders();

  }catch(e){

    alert("结账失败");

  }

}


/* =========================
   取消订单
========================= */

async function cancelOrder(id){

  if(!confirm(
    "确定取消这个订单吗？"
  ))return;

  await changeStatus(
    id,
    "CANCELLED"
  );

}


/* =========================
   退款
========================= */

async function refundOrder(id){

  if(!confirm(
    "确定要给这个订单做退款记录吗？"
  ))return;

  const transactionId=
    prompt(
      "请输入退款交易号（可选）：",
      ""
    );

  try{

    const r=await fetch(
      "/api/pos/orders/"+
      encodeURIComponent(id)+
      "/refund",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          transactionId:
            transactionId?
            transactionId.trim():
            ""
        })
      }
    );

    const d=await r.json();

    if(!r.ok){

      alert(
        d.error||"退款失败"
      );

      return;
    }

    alert("✅ 退款记录成功");

    loadOrders();

  }catch(e){

    alert("退款失败");

  }

}


/* =========================
   删除订单
========================= */

async function delOrder(id){

  if(!confirm(
    "确定删除这笔订单？\n删除后后台不会再显示。"
  ))return;

  try{

    const r=await api(
      "/api/orders/"+encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );

    if(!r.ok){

      const d=await r.json().catch(()=>({}));

      alert(d.error||"删除失败");

      return;
    }

    loadOrders();

  }catch(e){

    alert("删除失败");

  }

}


/* =========================
   统计
========================= */

function renderStats(s){

  document.getElementById("stats").innerHTML=`

    <div class="stat">
      <small>今日订单</small>
      <b>${s.todayOrders||0}</b>
    </div>

    <div class="stat">
      <small>今日营业额</small>
      <b>₩${won(s.todaySales)}</b>
    </div>

    <div class="stat">
      <small>今日已付款</small>
      <b>${s.todayPaidOrders||0}</b>
    </div>

    <div class="stat">
      <small>今日已收款</small>
      <b>₩${won(s.todayPaidSales)}</b>
    </div>

    <div class="stat">
      <small>累计已付款</small>
      <b>₩${won(s.paidSales)}</b>
    </div>

    <div class="stat">
      <small>已完成订单</small>
      <b>${s.completedOrders||0}</b>
    </div>

  `;

}


/* =========================
   菜单
========================= */

async function loadMenu(){

  try{

    const r=await api(
      "/api/menu/all"
    );

    const ms=await r.json();

    document.getElementById("menu").innerHTML=
      ms.map(x=>`

        <div class="menuRow">

          <span class="menuEmoji">
            ${x.emoji||"🍽️"}
          </span>

          <span class="name">

            <b>${escapeHtml(x.name)}</b>

            ${
              x.kr
              ?`<small style="color:#777">
                  / ${escapeHtml(x.kr)}
                </small>`
              :""
            }

          </span>

          <input
            id="p-${safeId(x.id)}"
            value="${Number(x.price)||0}"
            type="number"
            min="0"
          >

          <label>

            <input
              id="o-${safeId(x.id)}"
              type="checkbox"
              ${x.on!==false?"checked":""}
              style="width:auto"
            >

            上架

          </label>

          <button
            class="btn"
            onclick="saveMenu('${escapeAttr(x.id)}')">
            保存
          </button>

        </div>

      `).join("")
      ||'<div class="empty">暂无菜品</div>';

  }catch(e){

    document.getElementById("menu").innerHTML=
      '<div class="empty">菜单加载失败</div>';

  }

}


/* =========================
   ID安全
========================= */

function safeId(id){

  return String(id)
    .replace(/[^a-zA-Z0-9_-]/g,"_");

}

function escapeAttr(value){

  return String(value??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}

async function saveMenu(id){

  const sid=safeId(id);

  const price=
    Number(
      document.getElementById("p-"+sid).value
    );

  const on=
    document.getElementById("o-"+sid).checked;

  if(price<0 || !Number.isFinite(price)){

    alert("请输入正确价格");

    return;
  }

  try{

    const r=await api(
      "/api/menu",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          id,
          price,
          on
        })
      }
    );

    const d=await r.json();

    if(!r.ok){

      alert(d.error||"保存失败");

      return;
    }

    alert("✅ 菜品已保存");

    loadMenu();

  }catch(e){

    alert("保存失败");

  }

}

function openTable(table){

    "/?table="+table,
    "_blank"
  );

}


/* =========================
   下载二维码
========================= */

async function downloadQR(table){

  try{

    const r=
      await fetch(
        "/api/qr?table="+table
      );

    const blob=
      await r.blob();

    const a=
      document.createElement("a");

    const url=
      URL.createObjectURL(blob);

    a.href=url;

    a.download=
      "四季三餐_"+table+"号桌.svg";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  }catch(e){

    alert("二维码下载失败");

  }

}
