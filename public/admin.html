<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四季三餐 V6 营业后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:9;background:#173c2e;color:#fff;padding:13px 16px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.8}.wrap{max-width:1220px;margin:auto;padding:12px}.login{max-width:420px;margin:70px auto;background:#fff;border-radius:16px;padding:24px}.field{width:100%;padding:11px;border:1px solid #d9d9d9;border-radius:9px;margin:5px 0 10px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#173c2e;color:#fff;font-weight:800;cursor:pointer}.gray{background:#777}.red{background:#ad3d32}.gold{background:#a8781f}.blue{background:#28628e}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat,.panel{background:#fff;border-radius:13px;padding:12px}.stat b{display:block;font-size:21px;margin-top:3px}.panel{margin-top:10px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tables{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.tablebox{border:2px solid transparent;border-radius:10px;padding:10px 3px;text-align:center;background:#eee;font-size:12px;cursor:pointer}.tablebox b{font-size:16px}.tablebox.NEW{background:#ffd9d5}.tablebox.COOKING{background:#ffe8c4}.tablebox.DONE{background:#cfeadd}.tablebox.sel{border-color:#173c2e}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:9px}.order{border:1px solid #eee;border-left:6px solid #bbb;border-radius:12px;padding:12px}.order.NEW{border-left-color:#b63e34}.order.COOKING{border-left-color:#d88d29}.order.DONE{border-left-color:#2f8068}.head{display:flex;justify-content:space-between;font-size:17px;font-weight:900}.muted{font-size:12px;color:#777}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.note{background:#fff1c7;border-radius:8px;padding:8px;margin-top:6px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button{border:0;border-radius:7px;padding:8px}.print{font-size:12px;margin-top:6px}.menurow{display:grid;grid-template-columns:75px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.menuimg{width:72px;height:60px;object-fit:cover;border-radius:9px;background:#eee;display:grid;place-items:center;font-size:26px}.menuactions{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;border-radius:14px;background:#e5f3eb;font-size:12px}.badge.off{background:#ffd8d4}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:12px}.dialog{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:17px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.variant{display:grid;grid-template-columns:1fr 1fr 120px auto auto;gap:6px;align-items:center;margin:6px 0}.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.qrs div{text-align:center}.qrs img{width:115px;max-width:100%}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.tables{grid-template-columns:repeat(5,1fr)}.orders{grid-template-columns:1fr}.menurow{grid-template-columns:64px 1fr}.menuactions{grid-column:1/-1}.toolbar .btn{flex:1 1 45%}.row2{grid-template-columns:1fr}.variant{grid-template-columns:1fr 1fr}.variant .wide{grid-column:1/-1}}@media(max-width:430px){.wrap{padding:8px}.tables{gap:5px}.tablebox{padding:8px 2px}.stat{padding:9px}}
</style></head><body><header><div class="brand">四季三餐 · 사계삼찬</div><div class="sub">V6 营业版｜20桌可视化 · 厨房自动打印 · 手机后台</div></header><div id="app" class="wrap"></div>
<div id="menuModal" class="modal"><div class="dialog"><h2 id="modalTitle">菜品设置</h2><input id="eId" type="hidden"><label>中文菜名</label><input id="eName" class="field"><label>韩文菜名</label><input id="eKr" class="field"><div class="row2"><div><label>基础价格（无规格时使用）</label><input id="ePrice" class="field" type="number"></div><div><label>分类</label><input id="eCat" class="field"></div></div><label>Emoji</label><input id="eEmoji" class="field" value="🍽️"><label>菜品图片</label><input id="eImage" class="field" type="file" accept="image/*"><h3>大小份 / 规格</h3><p class="muted">有规格时，顾客必须选择规格；勾选“无限续面”后，该规格可免费追加面。</p><div id="variants"></div><button class="btn blue" onclick="addVariant()">＋ 添加规格</button><div style="display:flex;gap:8px;margin-top:15px"><button id="saveMenuBtn" class="btn" onclick="saveMenu()">保存</button><button class="btn gray" onclick="closeMenu()">取消</button></div></div></div>
<script>
const $=id=>document.getElementById(id), won=n=>Number(n||0).toLocaleString('ko-KR'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer=null,known=new Set(),soundOn=true,selectedTable=0,menuCache=[];
function beep(){if(!soundOn)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.16;o.start();setTimeout(()=>{o.stop();a.close()},260)}catch{}}
function loginView(){clearInterval(timer);app.innerHTML=`<div class="login"><h2>营业后台登录</h2><input id="pw" class="field" type="password" placeholder="后台密码"><button class="btn" onclick="login()">登录</button></div>`}
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(!r.ok)return alert('密码错误');showApp()}
async function showApp(){app.innerHTML=`<div class="toolbar"><button class="btn" onclick="refreshAll()">刷新</button><button class="btn gold" onclick="openMenu()">＋ 新增菜品</button><button class="btn blue" onclick="location.href='/history.html'">📜 订单历史</button><button id="soundBtn" class="btn gray" onclick="toggleSound()">🔊 新单声音：开</button><button class="btn gray" onclick="logout()">退出</button></div><div id="stats" class="stats"></div><div class="panel"><div class="panelhead"><h3>🪑 20桌实时状态</h3><span class="muted">点击桌号可筛选；红=新单 黄=制作中 绿=完成待结账</span></div><div id="tables" class="tables"></div></div><div class="panel"><div class="panelhead"><h3>正在制作</h3><span class="muted">完成后自动从这里消失</span></div><div id="orders" class="orders"></div></div><div class="panel"><div class="panelhead"><h3>✅ 已完成 · 待结账</h3><span class="muted">结账后进入历史记录</span></div><div id="doneOrders" class="orders"></div></div><div class="panel"><div class="panelhead"><h3>菜单管理</h3><span class="muted">支持大小份、不同价格、无限续面、售罄和图片</span></div><div id="menus"></div></div><details class="panel"><summary><b>20张桌子二维码</b></summary><div id="qrs" class="qrs"></div></details>`;for(let i=1;i<=20;i++)qrs.innerHTML+=`<div><img src="/api/qr?table=${i}"><br><b>${i}号桌</b></div>`;await refreshAll();clearInterval(timer);timer=setInterval(refreshOrders,3000)}
function toggleSound(){soundOn=!soundOn;soundBtn.textContent=(soundOn?'🔊':'🔇')+' 新单声音：'+(soundOn?'开':'关')}
async function refreshAll(){await Promise.all([refreshOrders(),loadMenu()])}
async function refreshOrders(){let [r,sr,tr]=await Promise.all([fetch('/api/orders'),fetch('/api/stats'),fetch('/api/tables')]);if(r.status===401)return loginView();let os=await r.json(),s=await sr.json(),ts=await tr.json();let ids=new Set(os.filter(o=>o.status==='NEW').map(o=>o.id));if(known.size&&[...ids].some(id=>!known.has(id)))beep();known=ids;stats.innerHTML=`<div class="stat">今日订单<b>${s.todayOrders||0}</b></div><div class="stat">新订单<b>${s.newOrders||0}</b></div><div class="stat">制作中<b>${s.cookingOrders||0}</b></div><div class="stat">待结账<b>${s.doneOrders||0}</b></div><div class="stat">已结账<b>${s.paidOrders||0}</b></div><div class="stat">今日实收<b>₩${won(s.todaySales)}</b></div>`;tables.innerHTML=ts.map(t=>`<div onclick="chooseTable(${t.table})" class="tablebox ${t.status} ${selectedTable===t.table?'sel':''}"><b>${String(t.table).padStart(2,'0')}桌</b><br>${{FREE:'空闲',NEW:'新单',COOKING:'制作中',DONE:'待结账'}[t.status]}${t.activeOrders?`<br>₩${won(t.activeTotal)}`:''}</div>`).join('');let filter=o=>!selectedTable||Number(o.table)===selectedTable||o.type==='TAKEOUT';let active=os.filter(o=>['NEW','COOKING'].includes(o.status)&&filter(o)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));let done=os.filter(o=>o.status==='DONE'&&filter(o)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));orders.innerHTML=active.map(orderCard).join('')||'<p>当前没有正在制作的订单。</p>';doneOrders.innerHTML=done.map(orderCard).join('')||'<p>当前没有待结账订单。</p>'}
function chooseTable(n){selectedTable=selectedTable===n?0:n;refreshOrders()}
function labelItem(x){let v=x.variantName?`（${esc(x.variantName)}）`:'';return `${esc(x.name)}${v}${x.refillable?' <b>· 无限续面</b>':''}`}
function orderCard(o){let st={NEW:'🔴 新订单',COOKING:'🟠 制作中',DONE:'🟢 已完成/待结账'}[o.status]||o.status,ps={PENDING:'待打印',CLAIMED:'发送中',PRINTED:'已打印',ERROR:'打印失败'}[o.printState||'PENDING'];return `<div class="order ${o.status}"><div class="head"><span>${o.type==='TAKEOUT'?'🥡 外带':`🪑 ${o.table}号桌`}${o.isRefill?' · 续面':''}</span><span>₩${won(o.total)}</span></div><div class="muted">${st} · ${new Date(o.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}<br>${esc(o.id)}</div>${o.items.map(x=>`<div class="item"><span>${labelItem(x)} × ${x.qty}</span><b>₩${won(x.price*x.qty)}</b></div>`).join('')}${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}<div class="print">🖨️ ${ps}${o.printCount?` · 已打印${o.printCount}次`:''}${o.printError?` · ${esc(o.printError)}`:''}</div><div class="actions">${o.status==='NEW'?`<button onclick="setStatus('${esc(o.id)}','COOKING')">制作中</button>`:''}${o.status==='COOKING'?`<button onclick="setStatus('${esc(o.id)}','DONE')">完成</button>`:''}${o.status==='DONE'?`<button style="background:#173c2e;color:white" onclick="setStatus('${esc(o.id)}','PAID')">💰 已结账</button>`:''}<button onclick="reprint('${esc(o.id)}')">🖨️ 补打</button><button onclick="setStatus('${esc(o.id)}','CANCELLED')">取消</button></div></div>`}
async function setStatus(id,status){let r=await fetch('/api/orders/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){let d=await r.json();return alert(d.error||'操作失败')}refreshOrders()}
async function reprint(id){let r=await fetch('/api/orders/'+encodeURIComponent(id)+'/reprint',{method:'POST'});if(!r.ok)return alert('补打请求失败');alert('已加入打印队列');refreshOrders()}
async function loadMenu(){let r=await fetch('/api/menu/all');if(r.status===401)return;menuCache=await r.json();menus.innerHTML=menuCache.map(x=>`<div class="menurow"><div>${x.image?`<img class="menuimg" src="${esc(x.image)}">`:`<div class="menuimg">${esc(x.emoji||'🍽️')}</div>`}</div><div><b>${esc(x.name)}</b> <span class="badge ${x.on?'':'off'}">${x.on?'在售':'已售罄'}</span><br><span class="muted">${esc(x.kr)} · ${esc(x.category||'未分类')}</span><br>${Array.isArray(x.variants)&&x.variants.length?x.variants.map(v=>`<span class="muted">${esc(v.name)}/${esc(v.kr)} ₩${won(v.price)}${v.refillable?' · 无限续面':''}</span>`).join('<br>'):`<b>₩${won(x.price)}</b>`}</div><div class="menuactions"><button class="btn blue" onclick="editMenu('${esc(x.id)}')">编辑</button><button class="btn ${x.on?'red':'gold'}" onclick="toggleMenu('${esc(x.id)}',${!x.on})">${x.on?'售罄下架':'恢复上架'}</button>${x.image?`<button class="btn gray" onclick="removePhoto('${esc(x.id)}')">删照片</button>`:''}</div></div>`).join('')}
async function toggleMenu(id,on){await menuPost({id,on});loadMenu()}async function menuPost(body){let r=await fetch('/api/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let d=await r.json();alert(d.error||'保存失败')}return r}
function openMenu(){eId.value='';eName.value='';eKr.value='';ePrice.value='';eCat.value='';eEmoji.value='🍽️';eImage.value='';variants.innerHTML='';modalTitle.textContent='＋ 新增菜品';menuModal.style.display='flex'}
function editMenu(id){let x=menuCache.find(m=>String(m.id)===String(id));if(!x)return;eId.value=x.id;eName.value=x.name||'';eKr.value=x.kr||'';ePrice.value=x.price||0;eCat.value=x.category||'';eEmoji.value=x.emoji||'🍽️';eImage.value='';variants.innerHTML='';(x.variants||[]).forEach(v=>addVariant(v));modalTitle.textContent='编辑菜品';menuModal.style.display='flex'}
function addVariant(v={}){let div=document.createElement('div');div.className='variant';div.innerHTML=`<input class="field vn" placeholder="大份" value="${esc(v.name||'')}"><input class="field vk" placeholder="대" value="${esc(v.kr||'')}"><input class="field vp" type="number" placeholder="价格" value="${Number(v.price||0)}"><label class="wide"><input class="vr" type="checkbox" ${v.refillable?'checked':''}> 无限续面 / 면 무한리필</label><button class="btn red" type="button" onclick="this.parentElement.remove()">删除</button>`;variants.appendChild(div)}
function collectVariants(){return [...variants.querySelectorAll('.variant')].map((d,i)=>({id:'v'+(i+1),name:d.querySelector('.vn').value.trim(),kr:d.querySelector('.vk').value.trim(),price:Number(d.querySelector('.vp').value||0),refillable:d.querySelector('.vr').checked})).filter(v=>v.name&&v.kr)}
async function saveMenu(){if(!eName.value.trim()||!eKr.value.trim()||!eCat.value.trim())return alert('请填写中文、韩文和分类');let fd=new FormData();if(eId.value)fd.append('id',eId.value);fd.append('name',eName.value.trim());fd.append('kr',eKr.value.trim());fd.append('price',ePrice.value||0);fd.append('category',eCat.value.trim());fd.append('emoji',eEmoji.value.trim()||'🍽️');fd.append('variants',JSON.stringify(collectVariants()));if(eImage.files[0])fd.append('image',eImage.files[0]);saveMenuBtn.disabled=true;let r=await fetch('/api/menu',{method:'POST',body:fd});saveMenuBtn.disabled=false;let d=await r.json();if(!r.ok)return alert(d.error||'保存失败');closeMenu();loadMenu()}
async function removePhoto(id){if(!confirm('确定删除照片？'))return;await fetch('/api/menu/'+encodeURIComponent(id)+'/image',{method:'DELETE'});loadMenu()}function closeMenu(){menuModal.style.display='none'}async function logout(){await fetch('/api/logout',{method:'POST'});loginView()}async function boot(){try{let r=await fetch('/api/stats',{cache:'no-store'});if(r.status===401)return loginView();if(r.ok)return showApp();}catch(e){}loginView()}boot();
</script></body></html>
