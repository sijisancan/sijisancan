<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单历史｜四季三餐</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1eb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif;color:#222}header{background:#173c2e;color:#fff;padding:15px}.wrap{max-width:1050px;margin:auto;padding:12px}.panel,.card{background:#fff;border-radius:13px;padding:12px;margin:9px 0}.filters{display:grid;grid-template-columns:160px 160px 1fr auto;gap:7px}.field,.btn{padding:10px;border-radius:8px;border:1px solid #ddd}.btn{background:#173c2e;color:white;border:0;font-weight:800}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary b{font-size:20px}.head,.line{display:flex;justify-content:space-between;gap:10px}.line{padding:4px 0}.muted{font-size:12px;color:#777}@media(max-width:650px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}</style></head><body><header><b>四季三餐 · 订单历史</b></header><main class="wrap"><div id="login"></div><div id="main" style="display:none"><div class="panel"><div class="filters"><input id="date" type="date" class="field"><select id="status" class="field"><option value="ALL">全部状态</option><option>PAID</option><option>DONE</option><option>CANCELLED</option><option>NEW</option><option>COOKING</option></select><input id="kw" class="field wide" placeholder="桌号 / 订单号 / 菜名"><button class="btn" onclick="render()">查询</button></div></div><div id="summary" class="panel summary"></div><div id="list"></div><button class="btn" onclick="location.href='/admin.html'">返回后台</button></div></main><script>
const $=id=>document.getElementById(id),won=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let orders=[];function kdate(v=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}$('date').value=kdate();async function init(){let r=await fetch('/api/orders');if(r.status===401){login.innerHTML=`<div class="panel"><h3>后台登录</h3><input id="pw" class="field" type="password"><button class="btn" onclick="doLogin()">登录</button></div>`;return}orders=await r.json();login.innerHTML='';main.style.display='block';render()}async function doLogin(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(!r.ok)return alert('密码错误');init()}function render(){let d=$('date').value,st=$('status').value,k=$('kw').value.trim().toLowerCase();let a=orders.filter(o=>(!d||kdate(o.createdAt)===d)&&(st==='ALL'||o.status===st)&&(!k||String(o.table).includes(k)||o.id.toLowerCase().includes(k)||o.items.some(x=>(x.name+' '+x.kr+' '+x.variantName).toLowerCase().includes(k))));let paid=a.filter(o=>o.status==='PAID'),sales=paid.reduce((s,o)=>s+Number(o.total||0),0);summary.innerHTML=`订单 <b>${a.length}</b>　已结账 <b>${paid.length}</b>　实收 <b>₩${won(sales)}</b>`;list.innerHTML=a.slice().sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt)).map(o=>`<div class="card"><div class="head"><b>${o.type==='TAKEOUT'?'外带':o.table+'号桌'} ${o.isRefill?'· 续面':''}</b><b>₩${won(o.total)}</b></div><div class="muted">${o.status} · ${new Date(o.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}<br>${esc(o.id)}</div>${o.items.map(x=>`<div class="line"><span>${esc(x.name)}${x.variantName?'（'+esc(x.variantName)+'）':''} × ${x.qty}</span><b>₩${won(x.price*x.qty)}</b></div>`).join('')}${o.note?`<p>备注：${esc(o.note)}</p>`:''}</div>`).join('')||'<div class="panel">没有符合条件的订单。</div>'}init();</script></body></html>
